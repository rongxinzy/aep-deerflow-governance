---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: digitalemployees.digitalemployee.zhiyuan.io
spec:
  group: digitalemployee.zhiyuan.io
  names:
    kind: DigitalEmployee
    listKind: DigitalEmployeeList
    plural: digitalemployees
    shortNames:
    - de
    singular: digitalemployee
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.runtime.type
      name: Runtime
      type: string
    - jsonPath: .spec.runtime.model
      name: Model
      type: string
    - jsonPath: .status.memoryUser
      name: MemoryUser
      type: string
    - jsonPath: .status.runtimeAccount
      name: Account
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DigitalEmployee is one governed agent instance; the CR name is the
          business ID that memory and knowledge bind to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DigitalEmployeeSpec defines the desired state of a digital
              employee.
            properties:
              a2a:
                description: A2A optionally exposes this employee over the A2A delegation
                  contract.
                properties:
                  image:
                    description: Image of the a2a-adapter container.
                    type: string
                  maxDepth:
                    description: MaxDepth is the delegation chain depth limit (default
                      3).
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  nodePort:
                    description: NodePort exposes the adapter; 0 means ClusterIP only.
                    format: int32
                    maximum: 32767
                    minimum: 30000
                    type: integer
                required:
                - image
                type: object
              channels:
                description: |-
                  Channels toggles IM channel providers; credentials arrive at runtime
                  via the gateway admin API, not through the CR.
                properties:
                  feishu:
                    description: Feishu enables the Feishu channel.
                    type: boolean
                  wecom:
                    description: Wecom enables the WeCom (企业微信) smart-bot channel.
                    type: boolean
                  wecomName:
                    description: |-
                      WecomName is the bot's display name on WeCom. @-mentions of this name
                      address the bot itself; the governance middleware tells the agent so
                      it never mistakes its own name for a delegation target.
                    type: string
                type: object
              conversationStore:
                description: |-
                  ConversationStore centralizes conversation persistence (postgres)
                  or keeps it per-employee on the home volume (sqlite, default).
                properties:
                  backend:
                    default: sqlite
                    enum:
                    - sqlite
                    - postgres
                    type: string
                type: object
              credentials:
                description: Credentials references the shared platform secret.
                properties:
                  name:
                    description: Name of the Secret in the employee namespace.
                    type: string
                required:
                - name
                type: object
              displayName:
                type: string
              governance:
                description: GovernanceSpec carries AEP governance middleware parameters.
                properties:
                  aepBaseURL:
                    type: string
                  apiServiceCreds:
                    type: string
                  defaultAEPUser:
                    type: string
                  deploymentID:
                    type: string
                  governedTools:
                    items:
                      type: string
                    type: array
                  identitySource:
                    type: string
                  teamNames:
                    additionalProperties:
                      type: string
                    type: object
                required:
                - aepBaseURL
                - defaultAEPUser
                - deploymentID
                type: object
              knowledge:
                description: KnowledgeSpec wires the enterprise knowledge base (WeKnora)
                  via MCP.
                properties:
                  mcpURL:
                    description: MCPURL of the WeKnora MCP bridge endpoint.
                    type: string
                  type:
                    description: Type of knowledge integration. Only "weknora" is
                      implemented.
                    enum:
                    - weknora
                    type: string
                required:
                - mcpURL
                - type
                type: object
              memory:
                description: MemorySpec configures long-term memory persistence.
                properties:
                  accountID:
                    description: AccountID is the OpenViking account the employee
                      user lives in.
                    type: string
                  maxInjectionChars:
                    format: int32
                    maximum: 100000
                    minimum: 256
                    type: integer
                  scoreThreshold:
                    maximum: 1
                    type: number
                  serverURL:
                    description: ServerURL of the OpenViking service.
                    type: string
                  singleTenantInstance:
                    default: false
                    description: |-
                      SingleTenantInstance maps every runtime user of this single-tenant
                      instance onto the employee's memory owner (per-request human identity
                      lives in governance, not in the memory tenant).
                    type: boolean
                  topK:
                    description: Retrieval tuning; zero values fall back to the backend
                      defaults.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  type:
                    description: Type of memory backend. Only "openviking" is implemented.
                    enum:
                    - openviking
                    type: string
                required:
                - accountID
                - serverURL
                - type
                type: object
              nodePort:
                description: NodePort exposes the runtime; 0 means ClusterIP only.
                format: int32
                maximum: 32767
                minimum: 30000
                type: integer
              owner:
                description: |-
                  Owner is the AEP user id of the employee's owner (set by the business
                  layer; the operator never interprets it).
                type: string
              ownerName:
                description: OwnerName is the owner's AEP username for display.
                type: string
              persistence:
                description: |-
                  Persistence makes the runtime home durable (threads, channel
                  credentials, auth DB survive pod restarts and image upgrades).
                properties:
                  enabled:
                    default: true
                    type: boolean
                  size:
                    default: 2Gi
                    description: Size of the home volume (minimum 1Gi).
                    type: string
                type: object
              replicas:
                default: 1
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              runtime:
                description: RuntimeSpec selects the execution engine and the model
                  route.
                properties:
                  apiKeyEnv:
                    description: |-
                      ApiKeyEnv names the credentials-Secret env var holding the provider
                      API key. Defaults to DEER_BENCH_API_KEY.
                    type: string
                  image:
                    description: |-
                      Image is the container image for the runtime (must embed the
                      governance middleware and MCP tooling).
                    type: string
                  model:
                    description: |-
                      Model is the wire model id routed by the Higress model gateway
                      (e.g. bench-glm). Never a provider-native model name.
                    type: string
                  modelBaseURL:
                    description: |-
                      ModelBaseURL is the model API base URL. Defaults to the in-cluster
                      Higress gateway when empty.
                    type: string
                  nativeModel:
                    description: |-
                      NativeModel is the provider-native model id behind the wire name
                      (Model stays the stable wire id agents and threads reference).
                      Defaults to Model (Higress passthrough).
                    type: string
                  provider:
                    description: |-
                      Provider selects the model protocol family. "openai" (default) keeps
                      the Higress-routed OpenAI-compatible path; "anthropic" connects the
                      runtime directly to an Anthropic-protocol endpoint (emergency
                      fallback when the in-cluster route is unavailable — the AEP model
                      registry only models openai-compatible providers).
                    enum:
                    - openai
                    - anthropic
                    type: string
                  type:
                    description: Type of the execution engine. Only "deerflow" is
                      implemented.
                    enum:
                    - deerflow
                    type: string
                required:
                - image
                - model
                - type
                type: object
              team:
                description: |-
                  Team scopes the employee to a department. Members of this AEP team
                  can see and converse with the employee in addition to the owner;
                  admins bypass all team scoping. Empty means visible to everyone
                  (legacy behavior for employees created before team scoping).
                type: string
            required:
            - credentials
            - governance
            - runtime
            type: object
          status:
            description: DigitalEmployeeStatus defines the observed state of a digital
              employee.
            properties:
              memoryUser:
                description: MemoryUser is the OpenViking user provisioned for this
                  employee.
                type: string
              message:
                description: Message carries the last error detail when Phase == Error.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: DigitalEmployeePhase describes the reconciliation phase.
                enum:
                - Pending
                - Ready
                - Error
                type: string
              runtimeAccount:
                description: |-
                  RuntimeAccount is the bootstrap state of the employee's runtime
                  account: the per-instance DeerFlow admin plus the owner account and
                  PAT provisioned through the runtime auth API (see the operator's
                  ensureRuntimeAccount). Ready means the PAT in the
                  de-<name>-runtime-creds Secret authenticates against the runtime.
                enum:
                - Pending
                - Ready
                - Failed
                - Unsupported
                type: string
              runtimeAccountMessage:
                description: |-
                  RuntimeAccountMessage carries the last runtime-account detail
                  (failure reason, upgrade hint, …).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
