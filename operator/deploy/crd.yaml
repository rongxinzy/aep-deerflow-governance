---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: digitalemployees.digitalemployee.zhiyuan.io
spec:
  group: digitalemployee.zhiyuan.io
  names:
    kind: DigitalEmployee
    listKind: DigitalEmployeeList
    plural: digitalemployees
    shortNames:
    - de
    singular: digitalemployee
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.runtime.type
      name: Runtime
      type: string
    - jsonPath: .spec.runtime.model
      name: Model
      type: string
    - jsonPath: .status.memoryUser
      name: MemoryUser
      type: string
    - jsonPath: .status.runtimeAccount
      name: Account
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DigitalEmployee is one governed agent instance; the CR name is the
          business ID that memory and knowledge bind to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DigitalEmployeeSpec defines the desired state of a digital
              employee.
            properties:
              a2a:
                description: A2A optionally exposes this employee over the A2A delegation
                  contract.
                properties:
                  image:
                    description: Image of the a2a-adapter container.
                    type: string
                  maxDepth:
                    description: MaxDepth is the delegation chain depth limit (default
                      3).
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  nodePort:
                    description: NodePort exposes the adapter; 0 means ClusterIP only.
                    format: int32
                    maximum: 32767
                    minimum: 30000
                    type: integer
                required:
                - image
                type: object
              channels:
                description: |-
                  Channels toggles IM channel providers; credentials arrive at runtime
                  via the gateway admin API, not through the CR.
                properties:
                  feishu:
                    description: Feishu enables the Feishu channel.
                    type: boolean
                  wecom:
                    description: Wecom enables the WeCom (企业微信) smart-bot channel.
                    type: boolean
                  wecomName:
                    description: |-
                      WecomName is the bot's display name on WeCom. @-mentions of this name
                      address the bot itself; the governance middleware tells the agent so
                      it never mistakes its own name for a delegation target.
                    type: string
                type: object
              conversationStore:
                description: |-
                  ConversationStore centralizes conversation persistence (postgres)
                  or keeps it per-employee on the home volume (sqlite, default).
                properties:
                  backend:
                    default: sqlite
                    enum:
                    - sqlite
                    - postgres
                    type: string
                  database:
                    description: |-
                      Physical database selection when Backend=postgres. Empty provisions a
                      per-employee database (de_<name>); any other value names an explicit
                      database the operator creates on boot. The reserved word "shared" is
                      rejected at reconciliation (the legacy shared database is gone).
                    pattern: ^[a-z][a-z0-9_]{0,40}$
                    type: string
                type: object
              credentials:
                description: Credentials references the shared platform secret.
                properties:
                  name:
                    description: Name of the Secret in the employee namespace.
                    type: string
                required:
                - name
                type: object
              description:
                description: |-
                  Description is the business-layer purpose statement (用途说明);
                  the operator never interprets it.
                maxLength: 500
                type: string
              displayName:
                type: string
              governance:
                description: GovernanceSpec carries AEP governance middleware parameters.
                properties:
                  aepBaseURL:
                    type: string
                  apiServiceCreds:
                    type: string
                  defaultAEPUser:
                    type: string
                  deploymentID:
                    type: string
                  deploymentName:
                    description: DeploymentName is the AEP deployment's verified display
                      name.
                    type: string
                  governedTools:
                    items:
                      type: string
                    type: array
                  identitySource:
                    type: string
                  teamNames:
                    additionalProperties:
                      type: string
                    type: object
                required:
                - aepBaseURL
                - defaultAEPUser
                - deploymentID
                type: object
              hibernation:
                description: |-
                  Hibernation optionally lets the operator scale the runtime to zero
                  when idle (KEDA watches the portal database's wake/activity tables).
                  Disabled by default; employees with an IM channel that holds an
                  outbound connection (WeCom) must stay resident until the
                  channel-gateway lands.
                properties:
                  enabled:
                    type: boolean
                  idleTimeout:
                    description: |-
                      IdleTimeout is how long the employee stays up after the last
                      activity before scaling to zero (e.g. "30m", "2h").
                    pattern: ^[0-9]+[smh]$
                    type: string
                type: object
              knowledge:
                description: KnowledgeSpec wires the enterprise knowledge base (WeKnora)
                  via MCP.
                properties:
                  bases:
                    description: |-
                      Bases is the employee's explicit knowledge-base whitelist (WeKnora
                      kb ids plus display-name snapshots). Non-nil means an explicit
                      policy: the operator renders it into the governance middleware,
                      which denies knowledge_search calls outside the list (an empty
                      non-nil list denies every search). Nil keeps the legacy behavior of
                      an unrestricted bridge credential.
                      No omitempty: an explicitly empty list (deny every search) must
                      survive JSON round-trips; absent/null decodes back to nil (legacy).
                    items:
                      description: |-
                        KnowledgeBaseRef references one WeKnora knowledge base by id with a
                        display-name snapshot for the console.
                      properties:
                        id:
                          description: ID is the WeKnora knowledge-base id.
                          type: string
                        name:
                          description: Name is the knowledge-base display name at
                            assignment time.
                          type: string
                      required:
                      - id
                      - name
                      type: object
                    maxItems: 200
                    type: array
                  mcpURL:
                    description: MCPURL of the WeKnora MCP bridge endpoint.
                    type: string
                  type:
                    description: Type of knowledge integration. Only "weknora" is
                      implemented.
                    enum:
                    - weknora
                    type: string
                required:
                - mcpURL
                - type
                type: object
              memory:
                description: MemorySpec configures long-term memory persistence.
                properties:
                  accountID:
                    description: AccountID is the OpenViking account the employee
                      user lives in.
                    type: string
                  maxInjectionChars:
                    format: int32
                    maximum: 100000
                    minimum: 256
                    type: integer
                  scoreThreshold:
                    maximum: 1
                    type: number
                  serverURL:
                    description: ServerURL of the OpenViking service.
                    type: string
                  singleTenantInstance:
                    default: false
                    description: |-
                      SingleTenantInstance maps every runtime user of this single-tenant
                      instance onto the employee's memory owner (per-request human identity
                      lives in governance, not in the memory tenant).
                    type: boolean
                  topK:
                    description: Retrieval tuning; zero values fall back to the backend
                      defaults.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  type:
                    description: Type of memory backend. Only "openviking" is implemented.
                    enum:
                    - openviking
                    type: string
                required:
                - accountID
                - serverURL
                - type
                type: object
              nodePort:
                description: NodePort exposes the runtime; 0 means ClusterIP only.
                format: int32
                maximum: 32767
                minimum: 30000
                type: integer
              owner:
                description: |-
                  Owner is the AEP user id of the employee's owner (set by the business
                  layer; the operator never interprets it).
                type: string
              ownerName:
                description: OwnerName is the owner's AEP username for display.
                type: string
              persistence:
                description: |-
                  Persistence makes the runtime home durable (threads, channel
                  credentials, auth DB survive pod restarts and image upgrades).
                properties:
                  enabled:
                    default: true
                    type: boolean
                  size:
                    default: 2Gi
                    description: Size of the home volume (minimum 1Gi).
                    type: string
                type: object
              replicas:
                default: 1
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              runtime:
                description: RuntimeSpec selects the execution engine and the model
                  route.
                properties:
                  apiKeyEnv:
                    description: |-
                      ApiKeyEnv names the credentials-Secret env var holding the provider
                      API key. Defaults to DEER_BENCH_API_KEY. Legacy form of
                      Models[0].apiKeyEnv.
                    type: string
                  image:
                    description: |-
                      Image is the container image for the runtime (must embed the
                      governance middleware and MCP tooling).
                    type: string
                  model:
                    description: |-
                      Model is the wire model id routed by the Higress model gateway
                      (e.g. bench-glm). Never a provider-native model name. Legacy form of
                      Models[0]; kept for existing CRs.
                    type: string
                  modelBaseURL:
                    description: |-
                      ModelBaseURL is the model API base URL. Defaults to the in-cluster
                      Higress gateway when empty. Legacy form of Models[0].baseURL.
                    type: string
                  models:
                    description: |-
                      Models lists the LLM routes the runtime may use, in priority order:
                      the first entry is the default the runtime picks when a caller does
                      not name one, later entries are selectable by name (DeerFlow resolves
                      per-request and per-subagent model choices against this list — it is
                      selection, not automatic failover). When empty the legacy singular
                      fields below define the single model.
                    items:
                      description: RuntimeModel is one LLM route in the runtime's
                        model list.
                      properties:
                        apiKeyEnv:
                          description: |-
                            ApiKeyEnv names the credentials-Secret env var holding the provider
                            API key.
                          type: string
                        baseURL:
                          description: |-
                            BaseURL is the model API base URL. For anthropic models served by
                            the AEP registry this is <gateway>/<model-id>.
                          type: string
                        name:
                          description: |-
                            Name is the wire model id (AEP model id) agents and threads
                            reference; also the selection key inside the runtime config.
                          type: string
                        nativeModel:
                          description: |-
                            NativeModel is the provider-native model id sent upstream. Defaults
                            to Name.
                          type: string
                        provider:
                          description: 'Provider selects the protocol family: "openai"
                            or "anthropic".'
                          enum:
                          - openai
                          - anthropic
                          type: string
                      required:
                      - name
                      - provider
                      type: object
                    type: array
                  nativeModel:
                    description: |-
                      NativeModel is the provider-native model id behind the wire name
                      (Model stays the stable wire id agents and threads reference).
                      Defaults to Model (Higress passthrough). Legacy form of
                      Models[0].nativeModel.
                    type: string
                  provider:
                    description: |-
                      Provider selects the model protocol family. "openai" (default) keeps
                      the Higress-routed OpenAI-compatible path; "anthropic" speaks the
                      Anthropic wire protocol — the AEP model registry serves it under a
                      per-model path prefix (http://<gateway>/<model-id>).
                    enum:
                    - openai
                    - anthropic
                    type: string
                  type:
                    description: Type of the execution engine. Only "deerflow" is
                      implemented.
                    enum:
                    - deerflow
                    type: string
                required:
                - image
                - model
                - type
                type: object
              skills:
                description: |-
                  Skills are the AEP skills enabled for this employee (set by the
                  business layer; the operator never interprets them). Each entry
                  pins the skill and the published version chosen at creation.
                items:
                  description: |-
                    SkillRef registers one AEP skill enabled for the employee, pinned to the
                    published version chosen at creation.
                  properties:
                    id:
                      description: ID is the AEP skill identifier (server-generated
                        slug).
                      type: string
                    name:
                      description: Name is the skill display name at assignment time.
                      type: string
                    version:
                      description: Version is the published skill version to use.
                      type: string
                  required:
                  - id
                  - name
                  - version
                  type: object
                maxItems: 200
                type: array
              team:
                description: |-
                  Team scopes the employee to a department. Members of this AEP team
                  can see and converse with the employee in addition to the owner;
                  admins bypass all team scoping. Empty means visible to everyone
                  (legacy behavior for employees created before team scoping).
                type: string
              teamName:
                description: TeamName is the owning team's verified AEP display-name
                  snapshot.
                type: string
              visibility:
                description: |-
                  Visibility is the employee's explicit open scope (who may see and
                  converse with it), enforced by the business layer. Nil keeps the
                  legacy owner/team rules.
                properties:
                  mode:
                    description: |-
                      Mode selects the scope: "all" opens the employee to every user,
                      "restricted" limits it to the listed teams and users.
                    enum:
                    - all
                    - restricted
                    type: string
                  teams:
                    description: Teams lists AEP teams whose members may use the employee.
                    items:
                      description: |-
                        SubjectRef references one AEP subject (team or user) by id with a
                        display-name snapshot.
                      properties:
                        id:
                          description: ID is the AEP team or user id.
                          type: string
                        name:
                          description: Name is the display name at assignment time.
                          type: string
                      required:
                      - id
                      - name
                      type: object
                    maxItems: 100
                    type: array
                  users:
                    description: Users lists AEP users who may use the employee.
                    items:
                      description: |-
                        SubjectRef references one AEP subject (team or user) by id with a
                        display-name snapshot.
                      properties:
                        id:
                          description: ID is the AEP team or user id.
                          type: string
                        name:
                          description: Name is the display name at assignment time.
                          type: string
                      required:
                      - id
                      - name
                      type: object
                    maxItems: 500
                    type: array
                required:
                - mode
                type: object
            required:
            - credentials
            - governance
            - runtime
            type: object
          status:
            description: DigitalEmployeeStatus defines the observed state of a digital
              employee.
            properties:
              memoryUser:
                description: MemoryUser is the OpenViking user provisioned for this
                  employee.
                type: string
              message:
                description: Message carries the last error detail when Phase == Error.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: DigitalEmployeePhase describes the reconciliation phase.
                enum:
                - Pending
                - Ready
                - Sleeping
                - Error
                type: string
              runtimeAccount:
                description: |-
                  RuntimeAccount is the bootstrap state of the employee's runtime
                  account: the per-instance DeerFlow admin plus the owner account and
                  PAT provisioned through the runtime auth API (see the operator's
                  ensureRuntimeAccount). Ready means the PAT in the
                  de-<name>-runtime-creds Secret authenticates against the runtime.
                enum:
                - Pending
                - Ready
                - Failed
                - Unsupported
                type: string
              runtimeAccountMessage:
                description: |-
                  RuntimeAccountMessage carries the last runtime-account detail
                  (failure reason, upgrade hint, …).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: personalworkspaces.digitalemployee.zhiyuan.io
spec:
  group: digitalemployee.zhiyuan.io
  names:
    kind: PersonalWorkspace
    listKind: PersonalWorkspaceList
    plural: personalworkspaces
    shortNames:
    - pw
    singular: personalworkspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PersonalWorkspace is one user's persistent companion environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PersonalWorkspaceSpec defines the desired state of a personal
              workspace.
            properties:
              browser:
                description: |-
                  Browser keeps the shared-browser policy (login state is a feature of
                  the avatar model, not a compromise). Stored for the gateway; the
                  operator does not enforce it in P0.
                properties:
                  maxTabs:
                    description: MaxTabs bounds concurrent browser sessions per workspace.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                  sharedProfile:
                    default: true
                    description: |-
                      SharedProfile keeps one shared browser profile (login state) across
                      the workspace's companions — the handoff-without-reconfiguration
                      feature of the avatar model. Default true.
                    type: boolean
                type: object
              companions:
                description: |-
                  Companions is the workspace's agent roster. Every entry gets its own
                  memory identity and private storage; entries share the workspace's
                  files and sessions. The list is managed by the business layer
                  (portal); the operator renders it but never interprets tool grants.
                items:
                  description: CompanionSpec is one companion agent in the workspace
                    roster.
                  properties:
                    displayName:
                      description: DisplayName is the roster label shown to the user.
                      type: string
                    memory:
                      description: Memory declares the companion's memory sharing
                        surface.
                      properties:
                        scopes:
                          description: |-
                            Scopes is the declared sharing surface (e.g. private, person, org).
                            The OpenViking ACL enforcement reads it via the gateway; the operator
                            only stores it.
                          items:
                            type: string
                          maxItems: 10
                          type: array
                        userKeySecret:
                          description: |-
                            UserKeySecret optionally names an externally managed Secret (key
                            OPENVIKING_API_KEY) instead of an operator-minted per-companion user.
                          type: string
                      type: object
                    model:
                      description: |-
                        Model is the AEP-approved model route the companion uses (wire id
                        routed by the model gateway, never a provider-native name).
                      type: string
                    name:
                      description: |-
                        Name identifies the companion for routing and storage namespacing
                        (DNS-label rules; unique inside the workspace).
                      pattern: ^[a-z]([a-z0-9-]{0,28}[a-z0-9])?$
                      type: string
                    resources:
                      description: Resources bounds this companion inside the workspace
                        budget.
                      properties:
                        cpu:
                          description: CPU is the companion's CPU cap (Kubernetes
                            quantity).
                          type: string
                        memory:
                          description: Memory is the companion's process memory cap
                            inside the workspace.
                          type: string
                      type: object
                    tools:
                      description: |-
                        Tools lists the capability faces the companion may use. Stored for the
                        gateway; the operator never interprets entries.
                      items:
                        type: string
                      maxItems: 20
                      type: array
                  required:
                  - model
                  - name
                  type: object
                maxItems: 10
                minItems: 1
                type: array
              credentials:
                description: |-
                  Credentials references the shared platform secret (OpenViking root
                  key, model API key). Secrets are never embedded in the CR.
                properties:
                  name:
                    description: Name of the Secret in the employee namespace.
                    type: string
                required:
                - name
                type: object
              image:
                description: |-
                  Image is the workspace container image (gateway + companion runtime).
                  Empty falls back to the operator's PERSONAL_WORKSPACE_IMAGE default.
                type: string
              memory:
                description: |-
                  Memory configures the shared OpenViking backend the companions'
                  per-companion users live in. Nil disables memory provisioning.
                properties:
                  accountID:
                    description: AccountID is the OpenViking account the employee
                      user lives in.
                    type: string
                  maxInjectionChars:
                    format: int32
                    maximum: 100000
                    minimum: 256
                    type: integer
                  scoreThreshold:
                    maximum: 1
                    type: number
                  serverURL:
                    description: ServerURL of the OpenViking service.
                    type: string
                  singleTenantInstance:
                    default: false
                    description: |-
                      SingleTenantInstance maps every runtime user of this single-tenant
                      instance onto the employee's memory owner (per-request human identity
                      lives in governance, not in the memory tenant).
                    type: boolean
                  topK:
                    description: Retrieval tuning; zero values fall back to the backend
                      defaults.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  type:
                    description: Type of memory backend. Only "openviking" is implemented.
                    enum:
                    - openviking
                    type: string
                required:
                - accountID
                - serverURL
                - type
                type: object
              owner:
                description: |-
                  Owner is the AEP user id of the workspace owner: the quota and RBAC
                  subject every companion in this workspace acts on behalf of.
                type: string
              resources:
                description: Resources bounds the workspace as a whole.
                properties:
                  disk:
                    default: 2Gi
                    description: |-
                      Disk is the workspace volume size (files, sessions, per-companion
                      SQLite). Default 2Gi.
                    type: string
                  memory:
                    default: 512Mi
                    description: Memory is the container memory limit. Default 512Mi.
                    type: string
                  vcpus:
                    description: |-
                      VCPUs is reserved for the microvm substrate (P1); the pod runtime
                      ignores it.
                    format: int32
                    maximum: 8
                    minimum: 1
                    type: integer
                type: object
              runtime:
                default: pod
                description: |-
                  Runtime selects the execution substrate. "pod" renders a plain
                  Deployment; "microvm" is reserved for the Firecracker backend and is
                  rejected until that lands.
                enum:
                - pod
                - microvm
                type: string
              security:
                description: |-
                  Security declares the workspace's egress surface. Stored for the
                  gateway/substrate; the operator does not render network policy in P0.
                properties:
                  egressAllow:
                    description: |-
                      EgressAllow lists the destination classes the workspace may reach
                      (model-gateway, memory, registry). Stored for the substrate; the
                      whitelist itself is rendered by the gateway/node agent, not P0.
                    items:
                      type: string
                    maxItems: 10
                    type: array
                type: object
            required:
            - companions
            - credentials
            - owner
            type: object
          status:
            description: PersonalWorkspaceStatus defines the observed state of a workspace.
            properties:
              gatewayEndpoint:
                description: |-
                  GatewayEndpoint is the in-cluster gateway service DNS name callers
                  (portal chat proxy) route to.
                type: string
              memoryUsers:
                description: |-
                  MemoryUsers lists the OpenViking user ids provisioned for the
                  companions (one per companion with memory enabled).
                items:
                  type: string
                type: array
              message:
                description: Message carries the last error detail when Phase == Failed.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: PersonalWorkspacePhase describes the reconciliation phase.
                enum:
                - Pending
                - Running
                - Failed
                - Terminating
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
