apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: digitalemployees.digitalemployee.zhiyuan.io
spec:
  group: digitalemployee.zhiyuan.io
  names:
    kind: DigitalEmployee
    listKind: DigitalEmployeeList
    plural: digitalemployees
    singular: digitalemployee
    shortNames: [de]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Runtime
          type: string
          jsonPath: .spec.runtime.type
        - name: Model
          type: string
          jsonPath: .spec.runtime.model
        - name: MemoryUser
          type: string
          jsonPath: .status.memoryUser
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [runtime, governance, credentials]
              properties:
                displayName:
                  type: string
                runtime:
                  type: object
                  required: [type, image, model]
                  properties:
                    type:
                      type: string
                      enum: [deerflow]
                    image:
                      type: string
                    model:
                      type: string
                    modelBaseURL:
                      type: string
                memory:
                  type: object
                  required: [type, serverURL, accountID]
                  properties:
                    type:
                      type: string
                      enum: [openviking]
                    serverURL:
                      type: string
                    accountID:
                      type: string
                    singleTenantInstance:
                      type: boolean
                    topK:
                      type: integer
                      format: int32
                    scoreThreshold:
                      type: number
                    maxInjectionChars:
                      type: integer
                      format: int32
                knowledge:
                  type: object
                  required: [type, mcpURL]
                  properties:
                    type:
                      type: string
                      enum: [weknora]
                    mcpURL:
                      type: string
                governance:
                  type: object
                  required: [aepBaseURL, deploymentID, defaultAEPUser]
                  properties:
                    aepBaseURL:
                      type: string
                    deploymentID:
                      type: string
                    defaultAEPUser:
                      type: string
                    identitySource:
                      type: string
                    governedTools:
                      type: array
                      items:
                        type: string
                    teamNames:
                      type: object
                      additionalProperties:
                        type: string
                    apiServiceCreds:
                      type: string
                credentials:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                owner:
                  type: string
                ownerName:
                  type: string
                replicas:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 10
                nodePort:
                  type: integer
                  format: int32
                  minimum: 30000
                  maximum: 32767
                a2a:
                  type: object
                  required: [image]
                  properties:
                    image:
                      type: string
                    maxDepth:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 10
                    nodePort:
                      type: integer
                      format: int32
                      minimum: 30000
                      maximum: 32767
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Ready, Error]
                observedGeneration:
                  type: integer
                  format: int64
                memoryUser:
                  type: string
                message:
                  type: string
