---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - '*'
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - '*'
- apiGroups:
  - digitalemployee.zhiyuan.io
  resources:
  - digitalemployees
  - personalworkspaces
  verbs:
  - '*'
- apiGroups:
  - digitalemployee.zhiyuan.io
  resources:
  - digitalemployees/finalizers
  - personalworkspaces/finalizers
  verbs:
  - update
- apiGroups:
  - digitalemployee.zhiyuan.io
  resources:
  - digitalemployees/status
  - personalworkspaces/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects
  - triggerauthentications
  verbs:
  - '*'
