# This rule is not used by the project de-op-kb itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over digitalemployee.zhiyuan.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: de-op-kb
    app.kubernetes.io/managed-by: kustomize
  name: digitalemployee-admin-role
rules:
- apiGroups:
  - digitalemployee.zhiyuan.io
  resources:
  - digitalemployees
  verbs:
  - '*'
- apiGroups:
  - digitalemployee.zhiyuan.io
  resources:
  - digitalemployees/status
  verbs:
  - get
