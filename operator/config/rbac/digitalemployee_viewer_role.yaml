# This rule is not used by the project de-op-kb itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to digitalemployee.zhiyuan.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: de-op-kb
    app.kubernetes.io/managed-by: kustomize
  name: digitalemployee-viewer-role
rules:
- apiGroups:
  - digitalemployee.zhiyuan.io
  resources:
  - digitalemployees
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - digitalemployee.zhiyuan.io
  resources:
  - digitalemployees/status
  verbs:
  - get
