# Builds the digital-employee operator image.
# - pull_request (operator/** changes): build only, never push — catches a
#   broken Dockerfile before release.
# - push of an `operator-v<semver>` tag: build, push to ghcr, attach SBOM and
#   provenance. The image tag drops the `operator-v` prefix.
# - workflow_dispatch: manual push with an explicit tag (break-glass).
# Pull from ghcr into Harbor afterwards; never push locally built images.
name: build-operator

on:
  pull_request:
    paths:
      - "operator/**"
      - ".github/workflows/build-operator.yml"
  push:
    tags: ["operator-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (SemVer, e.g. 0.22.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: build-operator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/rongxinzy/de-operator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            workflow_dispatch) tag="$INPUT_TAG" ;;
            push) tag="${REF_NAME#operator-v}" ;;
            *) tag="pr-${GITHUB_SHA::12}" ;;
          esac
          if [ "$EVENT" != pull_request ] && ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::image tag '$tag' is not SemVer"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "push=$([ "$EVENT" = pull_request ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: steps.tag.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on release)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: operator
          file: operator/Dockerfile
          push: ${{ steps.tag.outputs.push == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          # BuildKit attestations: SPDX SBOM + SLSA provenance stored with the image.
          sbom: ${{ steps.tag.outputs.push == 'true' }}
          provenance: ${{ steps.tag.outputs.push == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=operator
          cache-to: ${{ steps.tag.outputs.push == 'true' && 'type=gha,scope=operator,mode=max' || '' }}

      - name: GitHub build provenance attestation
        if: steps.tag.outputs.push == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Job summary
        env:
          PUSHED: ${{ steps.tag.outputs.push }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### de-operator"
            echo "| field | value |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}:${TAG}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| pushed | ${PUSHED} |"
            echo "| source | \`${GITHUB_SHA}\` |"
            if [ "$PUSHED" = true ]; then echo "| pin | \`${IMAGE}:${TAG}@${DIGEST}\` |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
