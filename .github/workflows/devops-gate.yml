name: DevOps gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: devops-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Verify CI inventory matches workflow triggers
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 .github/check-devops-config.py
      - name: Test gate decisions
        run: node --test .github/devops-gate.test.cjs
      - name: Validate metadata and wait for applicable existing CI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/.github/devops-gate.cjs`);
            const config = require(`${process.env.GITHUB_WORKSPACE}/.github/devops-ci.json`);
            await gate.run({ github, context, core, config });
