# Publishes the de-portal image to ghcr. The Dockerfile expects the static
# binary in the build context, so the workflow builds it first (same flags
# as the local flow: CGO_ENABLED=0 go build -trimpath).
name: build-portal

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.4.11)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rongxinzy/de-portal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: portal/go.sum

      - name: Vet, test, build the binary
        working-directory: portal
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -o de-portal .

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: portal
          file: portal/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
