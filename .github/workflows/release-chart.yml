# Packages the zhiyuan-stack chart and publishes it to the ghcr OCI
# registry on chart-v tags (chart-v0.2.0 -> chart 0.2.0 — the prefix keeps
# image-building v tags from colliding). Source-of-truth stays in this
# repo; the OCI artifact is what versioned environments consume:
#   helm upgrade --install zhiyuan oci://ghcr.io/rongxinzy/zhiyuan-stack \
#     --version <x.y.z> -f values-<env>.local.yaml -n digital-employees
name: release-chart

on:
  push:
    tags: ["chart-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Resolve chart version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#chart-v}" >> "$GITHUB_OUTPUT"

      - name: Align chart version with the tag
        working-directory: charts/zhiyuan-stack
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: $VERSION/" Chart.yaml
          helm lint .

      - name: Package
        run: |
          mkdir -p dist
          helm package charts/zhiyuan-stack -d dist

      - name: Push to ghcr OCI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/zhiyuan-stack-*.tgz oci://ghcr.io/rongxinzy
