# Publishes the governed DeerFlow runtime image (deerflow-gov) to ghcr.
#
# This image is LINEAGE-BASED: each version refreshes sources on top of the
# previous published image (the scratch recipe needs offline uv/python pieces
# that are not reproducible in CI). The base therefore comes from ghcr itself:
#   variant=governance → context = this repo, Dockerfile.deerflow-gov-governance
#   variant=backend    → context = the DeerFlow fork, Dockerfile.deerflow-gov
# The lineage root (v15 and earlier) lives on the intranet registry and was
# seeded to ghcr once; never rebuild those from scratch.
name: build-deerflow-gov

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Target image tag (e.g. v16)"
        required: true
      base:
        description: "Base image tag on ghcr (e.g. v15)"
        required: true
      variant:
        description: "governance (middleware only) or backend (full backend refresh)"
        required: false
        default: governance
      deerflow_ref:
        description: "DeerFlow fork ref for variant=backend (branch/tag/sha)"
        required: false
        default: main

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/rongxinzy/deerflow-gov

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout DeerFlow (backend variant)
        if: inputs.variant == 'backend'
        uses: actions/checkout@v7
        with:
          repository: rongxinzy/deer-flow
          ref: ${{ inputs.deerflow_ref }}
          path: deerflow

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (governance variant)
        id: build_governance
        if: inputs.variant != 'backend'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: k3s/Dockerfile.deerflow-gov-governance
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          sbom: true
          provenance: mode=max
          build-args: |
            BASE=${{ env.IMAGE }}:${{ inputs.base }}

      - name: Build and push (backend variant)
        id: build_backend
        if: inputs.variant == 'backend'
        uses: docker/build-push-action@v7
        with:
          context: ./deerflow/backend
          file: k3s/Dockerfile.deerflow-gov
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          sbom: true
          provenance: mode=max
          build-args: |
            BASE=${{ env.IMAGE }}:${{ inputs.base }}

      - name: Resolve digest
        id: digest
        env:
          GOV: ${{ steps.build_governance.outputs.digest }}
          BACKEND: ${{ steps.build_backend.outputs.digest }}
        run: echo "digest=${GOV:-$BACKEND}" >> "$GITHUB_OUTPUT"

      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Job summary
        env:
          TAG: ${{ inputs.tag }}
          BASE_TAG: ${{ inputs.base }}
          VARIANT: ${{ inputs.variant }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "### deerflow-gov"
            echo "| field | value |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}:${TAG}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| pin | \`${IMAGE}:${TAG}@${DIGEST}\` |"
            echo "| base | \`${IMAGE}:${BASE_TAG}\` (lineage image, not reproducible from source) |"
            echo "| variant | ${VARIANT} |"
            echo "| source | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
