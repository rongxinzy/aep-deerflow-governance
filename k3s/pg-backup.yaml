# Nightly logical backup of the shared postgres instance (AEP + portal +
# per-DE conversation databases). Born from the scale-round WAL incident:
# local-path single-replica postgres loses its checkpoint record on a dirty
# shutdown, and there was no fallback copy. pg_dumpall covers every database
# and role in one file; dumps stay on the same node's local-path volume, so
# this is an accident-recovery baseline, not off-site disaster recovery.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
  namespace: aep-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: aep-system
spec:
  # Off the :00/:30 marks; 02:2x is the quiet window on this stack.
  schedule: "23 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-backup
              image: 172.18.5.251:8081/zhiyuan/postgres:17.6-alpine
              env:
                - name: PGHOST
                  value: postgres.aep-system.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: aep
                - name: PGPASSWORD
                  value: aep
              command: ["sh", "-ec"]
              args:
                - |
                  set -eu
                  stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
                  target="/backups/aep-all-${stamp}.sql.gz"
                  pg_dumpall --no-password | gzip > "${target}.tmp"
                  mv "${target}.tmp" "${target}"
                  echo "wrote ${target} ($(du -h "${target}" | cut -f1))"
                  # Retention: keep the newest 7 dumps.
                  ls -1t /backups/aep-all-*.sql.gz | tail -n +8 | xargs -r rm -v
                  ls -lh /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: pg-backups
