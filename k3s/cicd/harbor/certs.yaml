apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: infra-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: infra-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: zhiyuan-infra-ca
  secretName: infra-ca-keypair
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: infra-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: infra-ca-issuer
spec:
  ca:
    secretName: infra-ca-keypair
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-tls
  namespace: harbor
spec:
  secretName: harbor-tls
  duration: 8760h
  renewBefore: 720h
  ipAddresses:
    - 172.18.5.189
  dnsNames:
    - harbor.local
    - harbor
  issuerRef:
    name: infra-ca-issuer
    kind: ClusterIssuer
