# OpenAI→Anthropic 转换子路由（OpenViking VLM 使用）——经 Higress ai-proxy
# claude provider 双向转换并注入凭证。历史使命已完成：Anthropic 原生透传
# 已收编进 AEP 模型目录（protocol: anthropic，gateway-reconciler 渲染
# EnvoyFilter，客户端 baseURL 为 http://<gateway>/<模型ID>，如
# http://higress-gateway.../bench-anthropic）。本清单自 2026-10-03 起只保留
# 转换子路由；新增 anthropic 模型请走 AEP（aepctl model create --protocol
# anthropic + data-plane publish），不要再扩展本文件。
#
# 坑位备忘（勿再踩）：
#   - ai-proxy 只认标准路径（/v1/chat/completions 等），故本路由用 Exact
#     精确路径；透传时代靠它压过 /v1 前缀，现在前缀路由已不存在。
#   - BigModel 双鉴权头并存时优先 Authorization，dummy Bearer 会 401 →
#     补丁把 authorization 与 x-api-key 都覆写真值。
#   - request_headers_to_add 必须放 Route 层（route: 下 istiod 静默丢弃）。
#   - dns 型 registry 动态解析 open.bigmodel.cn，抗 CDN 地址轮换。
#
# The API key is a deploy-time secret: render with
#   BIGMODEL_API_KEY=... envsubst < bigmodel-anthropic-route.yaml | kubectl apply -f -
apiVersion: networking.higress.io/v1
kind: McpBridge
metadata:
  name: default
  namespace: higress-system
spec:
  registries:
    - type: dns
      name: bigmodel
      domain: open.bigmodel.cn
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aep-model-gateway-bigmodel-vlm
  namespace: higress-system
  annotations:
    higress.io/backend-protocol: HTTPS
    higress.io/destination: bigmodel.dns
    higress.io/proxy-ssl-name: open.bigmodel.cn
    higress.io/proxy-ssl-server-name: "on"
spec:
  ingressClassName: higress
  rules:
    - http:
        paths:
          - backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
            path: /v1/chat/completions
            pathType: Exact
---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: aep-ai-proxy-bigmodel-vlm
  namespace: higress-system
spec:
  defaultConfigDisable: true
  matchRules:
    - ingress:
        - aep-model-gateway-bigmodel-vlm
      config:
        provider:
          type: claude
          apiTokens:
            - "${BIGMODEL_API_KEY}"
  url: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/ai-proxy:2.0.1
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: bigmodel-anthropic-passthrough
  namespace: higress-system
spec:
  configPatches:
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: aep-model-gateway-bigmodel-vlm
      patch:
        operation: MERGE
        value:
          # request_headers_to_add lives on the Route, not the RouteAction —
          # nesting it under `route` makes istiod silently drop it.
          request_headers_to_add:
            - header:
                key: authorization
                value: "Bearer ${BIGMODEL_API_KEY}"
              append: false
            - header:
                key: x-api-key
                value: "${BIGMODEL_API_KEY}"
              append: false
          route:
            host_rewrite_literal: open.bigmodel.cn
            regex_rewrite:
              pattern:
                google_re2: {}
                regex: "^/v1/(.*)$"
              substitution: "/api/anthropic/v1/\\1"
