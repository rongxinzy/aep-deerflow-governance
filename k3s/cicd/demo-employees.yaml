apiVersion: digitalemployee.zhiyuan.io/v1alpha1
kind: DigitalEmployee
metadata:
  name: finance-helper
  namespace: digital-employees
spec:
  displayName: 财务助理
  runtime:
    type: deerflow
    image: 172.18.5.251:8081/zhiyuan/deerflow-gov:v15
    model: bench-glm
    modelBaseURL: http://higress-gateway.higress-system.svc.cluster.local/bench-anthropic
    provider: anthropic
    nativeModel: glm-5.3-flash
    apiKeyEnv: BIGMODEL_API_KEY
  memory:
    type: openviking
    serverURL: http://openviking.memory-system.svc.cluster.local:1933
    accountID: zhiyuan
    singleTenantInstance: true
  governance:
    aepBaseURL: http://aep-control-service.aep-system.svc:8080
    deploymentID: demo
    defaultAEPUser: 644b9d2e-3222-4034-9dcf-5d4e8931e2db
    identitySource: wecom
  credentials:
    name: de-platform-creds
  persistence:
    enabled: true
    size: 2Gi
---
