  restrictInternalTraffic: true
  type: k3s
  kubeAPIServerSourceCIDRs: []
  v1DataEngineInitiatorSourceCIDRs: []
  recoveryBackendAdditionalIngressPorts: []
  metricsScrapeSources: []
