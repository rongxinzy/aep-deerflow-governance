      tag: v0.0.98
  csi:
    attacher:
      registry: ''
      repository: 172.18.5.251:8081/zhiyuan/longhorn-csi-attacher
      tag: v4.13.0
    provisioner:
      registry: ''
      repository: 172.18.5.251:8081/zhiyuan/longhorn-csi-provisioner
      tag: v6.3.0
    nodeDriverRegistrar:
      registry: ''
      repository: 172.18.5.251:8081/zhiyuan/longhorn-csi-node-driver-registrar
      tag: v2.18.0
    resizer:
      registry: ''
      repository: 172.18.5.251:8081/zhiyuan/longhorn-csi-resizer
      tag: v2.2.1
    snapshotter:
      registry: ''
      repository: 172.18.5.251:8081/zhiyuan/longhorn-csi-snapshotter
      tag: v8.6.0
    livenessProbe:
      registry: ''
