# Memory stack for the cicd cluster. Same shape as ../memory-stack.yaml with
# cicd differences baked in.
#
# NOTE (2026-10-06): the Helm release `zhiyuan` (chart charts/zhiyuan-stack,
# template memory-stack.yaml) owns the live openviking-config ConfigMap —
# this manifest is kept as the rendered reference of current cicd state and
# is NOT applied anymore. The authoritative values live in the chart's
# values (see values-cicd.example.yaml memory.openviking.vlm).
#
# VLM notes:
#   - extraction rides the on-prem Qwen server directly, not Higress: the
#     gateway's openai-compat conversion route is shadowed by a legacy
#     manual /v1/chat/completions ingress (longest-prefix wins) — recorded
#     as an AEP gap. Revisit when the shadowing is fixed.
#   - Qwen3.8-Flash-Next is a thinking model: enable_thinking=false is
#     required or the answer stays in reasoning_content and extraction
#     returns 0 hits; 300s timeout because the on-prem server is slow.
#   - root_api_key is a deploy-time secret: render with
#       OPENVIKING_ROOT_API_KEY=... envsubst < memory-stack.yaml | kubectl apply -f -
# Embedding stays on the local embed-server (not a GLM concern).
apiVersion: v1
kind: Namespace
metadata:
  name: memory-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-server
  namespace: memory-system
  labels: {app: embed-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app: embed-server}
  template:
    metadata:
      labels: {app: embed-server}
    spec:
      containers:
        - name: embed-server
          image: harbor.zhiyuan.local:30443/zhiyuan/embed-server:0.1.0
          args: ["--port", "8080", "-m", "/opt/models/bge-small-zh-v1.5-f16.gguf"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: embed-server
  namespace: memory-system
spec:
  selector: {app: embed-server}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openviking-data-lh
  namespace: memory-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: memory-system
data:
  ov.conf: |
    {
      "storage": {
        "workspace": "/app/.openviking/openviking_workspace",
        "vectordb": {"name": "context", "backend": "local"},
        "agfs": {"backend": "local"}
      },
      "log": {"level": "INFO", "output": "stdout"},
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "root_api_key": "${OPENVIKING_ROOT_API_KEY}"
      },
      "embedding": {
        "allow_metadata_override": true,
        "dense": {
          "api_base": "http://embed-server:8080/v1",
          "api_key": "none",
          "provider": "openai",
          "dimension": 512,
          "model": "bge-small-zh-v1.5"
        }
      },
      "vlm": {
        "api_base": "http://172.18.6.119:8080/v1",
        "timeout": 300,
        "thinking": false,
        "api_key": "none",
        "provider": "openai",
        "model": "Qwen3.8-Flash-Next",
        "extra_request_body": {
          "chat_template_kwargs": {
            "enable_thinking": false
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: memory-system
  labels: {app: openviking}
spec:
  replicas: 1
  selector:
    matchLabels: {app: openviking}
  template:
    metadata:
      labels: {app: openviking}
    spec:
      containers:
        - name: openviking
          image: harbor.zhiyuan.local:30443/zhiyuan/openviking:0.4.21
          ports:
            - containerPort: 1933
          volumeMounts:
            - name: data
              mountPath: /app/.openviking
            - name: config
              mountPath: /app/.openviking/ov.conf
              subPath: ov.conf
          readinessProbe:
            httpGet: {path: /ready, port: 1933}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 1933}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 4Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openviking-data-lh
        - name: config
          configMap:
            name: openviking-config
---
apiVersion: v1
kind: Service
metadata:
  name: openviking
  namespace: memory-system
spec:
  selector: {app: openviking}
  ports:
    - port: 1933
      targetPort: 1933
