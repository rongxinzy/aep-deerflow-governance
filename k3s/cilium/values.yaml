# Cilium 一期 values：替代 Flannel 与 k3s 内置 NetworkPolicy 控制器。
# 目标集群：k3s v1.36（5 节点），podCIDR 10.42.0.0/16，serviceCIDR 10.43.0.0/16。
# 迁移手册见 zhiyuan-docs/guides/cilium-migration.md。

# 镜像统一走 JFrog 归档仓（172.18.5.251:8081/zhiyuan，已拍平为单平台，digest 与 quay 不一致，
# 故用 override 整体指定并绕开 useDigest）。节点 registries.yaml 已配置 jfrog 认证与 mirror 兜底。
image:
  override: "172.18.5.251:8081/zhiyuan/cilium:v1.20.2"
envoy:
  image:
    override: "172.18.5.251:8081/zhiyuan/cilium-envoy:v1.37.6-1789133542-cbec91f666af0bf742da986d43832932dbb26b82"
operator:
  replicas: 2
  prometheus:
    enabled: true
  image:
    override: "172.18.5.251:8081/zhiyuan/cilium-operator:v1.20.2"

# k3s 关闭 flannel 后不为 containerd 配置 CNI 路径，containerd 回落到默认 /etc/cni/net.d 与
# /opt/cni/bin（实测 k3s v1.36 生成的 containerd config.toml 无 cni 段），Cilium 跟随默认路径。
cni:
  binPath: /opt/cni/bin
  confPath: /etc/cni/net.d
  # kubeProxyReplacement=false 时 Cilium 不原生实现 hostPort，需链接 portmap 插件。
  # portmap 二进制取自 k3s 自带（/var/lib/rancher/k3s/data/current/bin/portmap），已预置到各节点 binPath。
  # hostPort 依赖方：new-api-ingress(3000)、svclb-traefik/svclb-higress-gateway(80/443)。
  chainingMode: portmap

ipam:
  # 沿用 k3s 已为各节点分配的 podCIDR（10.42.x.0/24），切换前后地址段不变。
  mode: kubernetes

# 节点跨 172.18.5.0/24 与 172.18.6.0/24 两个子网，继续用 overlay，语义与 Flannel VXLAN 一致，
# 不要求底层网络放行 Pod CIDR 路由。
routingMode: tunnel
tunnelProtocol: vxlan

# 一期保留 k3s 内置 kube-proxy，降低切换面；二期替换时再改为 "true" 并配置 k8sServiceHost/Port。
kubeProxyReplacement: "false"

prometheus:
  # cilium-agent 指标；Pod 自带 prometheus.io/scrape 注解，由 monitoring 命名空间的 Prometheus 抓取。
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
    image:
      override: "172.18.5.251:8081/zhiyuan/hubble-relay:v1.20.2"
  ui:
    enabled: true
    frontend:
      image:
        override: "172.18.5.251:8081/zhiyuan/hubble-ui:v0.13.6"
    backend:
      image:
        override: "172.18.5.251:8081/zhiyuan/hubble-ui-backend:v0.13.6"
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp

# 二期可选能力（切换稳定后逐项开启，均需在维护窗口外小步验证）：
#
# kube-proxy 替换（需先为 API Server 配置固定入口地址/VIP，当前无 VIP）：
# kubeProxyReplacement: "true"
# k8sServiceHost: <api-vip>
# k8sServicePort: 6443
#
# 节点间透明加密（WireGuard）：
# encryption:
#   enabled: true
#   type: wireguard
#
# 固定出口 IP（Egress Gateway，用于外部大模型 API 白名单）：
# egressGateway:
#   enabled: true
# bpf:
#   masquerade: true
