# deerflow-chat-ui: the reused DeerFlow frontend in platform mode.
# Serves the web chat for digital employees: the browser arrives from the
# portal's /chat entry page (login + employee picker) holding the portal
# session, CSRF, and de_employee cookies — cookies are not port-isolated, so
# the same hostname serves both this origin (:30195) and the portal (:30190).
# API calls go same-origin /api/v1/employees/{name}/chat/... and are baked
# (build time!) to rewrite onto the de-portal Service.
#
# The image must be built with:
#   --build-arg NEXT_PUBLIC_PLATFORM_MODE=true
#   --build-arg NEXT_PUBLIC_PORTAL_CHAT_URL=http://<host>:30190/chat
#   --build-arg PLATFORM_GATEWAY_URL=http://de-portal.digital-employees.svc:8090
# (NEXT_PUBLIC_* inlines into the client bundle and the gateway URL lands in
# .next/routes-manifest.json — runtime env cannot change either.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deerflow-chat-ui
  namespace: digital-employees
  labels: {app: deerflow-chat-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app: deerflow-chat-ui}
  template:
    metadata:
      labels: {app: deerflow-chat-ui}
    spec:
      containers:
        - name: chat-ui
          image: 172.18.5.251:8081/zhiyuan/deerflow-chat-ui:0.1.4
          # The API proxy route handler reads this at request time (unlike
          # the baked NEXT_PUBLIC_* values, this one is runtime-configurable).
          env:
            - name: DEER_FLOW_INTERNAL_GATEWAY_BASE_URL
              value: http://de-portal.digital-employees.svc:8090
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /login, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: deerflow-chat-ui
  namespace: digital-employees
spec:
  type: NodePort
  selector: {app: deerflow-chat-ui}
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30195
