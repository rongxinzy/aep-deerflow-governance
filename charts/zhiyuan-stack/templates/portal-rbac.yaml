apiVersion: v1
kind: ServiceAccount
metadata:
  name: de-portal
  namespace: {{ include "zhiyuan.ns" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: de-portal
  namespace: {{ include "zhiyuan.ns" . }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["digitalemployee.zhiyuan.io"]
    resources: ["digitalemployees"]
    # update backs the PATCH /api/v1/employees/{name} config-edit path.
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups:
    - digitalemployee.zhiyuan.io
    resources:
    - personalworkspaces
    verbs:
    - create
    - get
    - list
    - watch
    - update
    - delete
  - apiGroups: [""]
    resources: ["secrets"]
    # create/update backs the employee mailbox config surface: the portal is
    # the single writer of de-<name>-email (EMAIL_MAILBOXES credentials).
    # ResourceNames is not used: names are employee-derived and hot-managed.
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: de-portal
  namespace: {{ include "zhiyuan.ns" . }}
subjects:
  - {kind: ServiceAccount, name: de-portal, namespace: {{ include "zhiyuan.ns" . }}}
roleRef: {kind: Role, name: de-portal, apiGroup: rbac.authorization.k8s.io}
