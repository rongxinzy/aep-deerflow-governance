{{- if .Values.adminConsole.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: de-admin-console
  namespace: {{ include "zhiyuan.ns" . }}
  labels: {app: de-admin-console}
spec:
  replicas: 1
  selector:
    matchLabels: {app: de-admin-console}
  template:
    metadata:
      labels: {app: de-admin-console}
    spec:
      containers:
        - name: admin-console
          image: {{ include "zhiyuan.image" (dict "registry" .Values.global.registry "repo" .Values.images.adminConsole.repository "tag" .Values.images.adminConsole.tag "digest" .Values.images.adminConsole.digest) }}
          env:
            - {name: ZHIYUAN_AEP_BASE_URL, value: {{ .Values.adminConsole.aepBaseURL | quote }}}
            - {name: ZHIYUAN_PORTAL_BASE_URL, value: {{ .Values.adminConsole.portalBaseURL | quote }}}
            - {name: ZHIYUAN_WEKNORA_UI_URL, value: {{ .Values.adminConsole.weknoraUIURL | quote }}}
            - {name: ZHIYUAN_COMPANION_BASE_URL, value: {{ .Values.adminConsole.companionBaseURL | quote }}}
          ports:
            - containerPort: 5173
            - containerPort: 5174
              name: weknora
          readinessProbe:
            httpGet: {path: /, port: 5173}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: de-admin-console
  namespace: {{ include "zhiyuan.ns" . }}
spec:
  type: NodePort
  selector: {app: de-admin-console}
  ports:
    # 多端口 Service 端口必须全命名（k8s 校验）；console 是既有名字，线上已存在
    - port: 80
      name: console
      targetPort: 5173
      nodePort: {{ .Values.adminConsole.nodePort }}
    # WeKnora management UI: the console container proxies the WeKnora
    # frontend on a dedicated port (root path — WeKnora's build uses
    # root-absolute asset/API paths and cannot live under a subpath).
    # Service port must differ from the console port (uniqueness), the
    # nodePort is what browsers hit.
    - port: 81
      name: weknora
      targetPort: 5174
      nodePort: {{ .Values.adminConsole.weknoraNodePort }}
{{- end }}
