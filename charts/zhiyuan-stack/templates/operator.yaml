apiVersion: apps/v1
kind: Deployment
metadata:
  name: de-operator
  namespace: {{ include "zhiyuan.ns" . }}
  labels: {app: de-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: de-operator}
  template:
    metadata:
      labels: {app: de-operator}
    spec:
      serviceAccountName: de-operator
      containers:
        - name: operator
          image: {{ include "zhiyuan.image" (dict "registry" .Values.global.registry "repo" .Values.images.operator.repository "tag" .Values.images.operator.tag) }}
          # 渲染 per-员工对话库 DSN 需要 CONVERSATION_ADMIN_DB_URL（平台凭据）。
          # 此前线上是手工 kubectl patch 补的 envFrom——chart 版本一旦接管即被
          # 覆盖丢失（2026-10-15 事故：全体员工 reconcile 失败）。
          envFrom:
            - secretRef: {name: de-platform-creds}
          env:
            - {name: HIBERNATION_DB_URL_SECRET, value: de-portal-db}
            - {name: HIBERNATION_IDLE_TIMEOUT_SECONDS, value: "1800"}
            {{- if .Values.channelGateway.enabled }}
            - {name: CHANNEL_GATEWAY_URL, value: "http://de-channel-gateway.{{ include "zhiyuan.ns" . }}.svc.cluster.local:8899"}
            {{- end }}
            {{- if .Values.workspaceAgent.microvmNodes }}
            - {name: WORKSPACE_MICROVM_NODES, value: {{ join "," .Values.workspaceAgent.microvmNodes | quote }}}
            - {name: WORKSPACE_MICROVM_SUBNET, value: {{ .Values.workspaceAgent.microvmSubnet | quote }}}
            {{- end }}
          args: ["--namespace", {{ include "zhiyuan.ns" . | quote }}, "--leader-elect"]
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
