apiVersion: apps/v1
kind: Deployment
metadata:
  name: de-operator
  namespace: {{ include "zhiyuan.ns" . }}
  labels: {app: de-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: de-operator}
  template:
    metadata:
      labels: {app: de-operator}
    spec:
      serviceAccountName: de-operator
      containers:
        - name: operator
          image: {{ include "zhiyuan.image" (dict "registry" .Values.global.registry "repo" .Values.images.operator.repository "tag" .Values.images.operator.tag "digest" .Values.images.operator.digest) }}
          # 渲染 per-员工对话库 DSN 需要 CONVERSATION_ADMIN_DB_URL（平台凭据）。
          # 此前线上是手工 kubectl patch 补的 envFrom——chart 版本一旦接管即被
          # 覆盖丢失（2026-10-15 事故：全体员工 reconcile 失败）。
          envFrom:
            - secretRef: {name: de-platform-creds}
          env:
            - {name: HIBERNATION_DB_URL_SECRET, value: de-portal-db}
            # db-init 镜像走 Harbor（离线可安装），不依赖 operator 编译期的 docker.io 默认。
            - {name: CONVERSATION_INIT_IMAGE, value: {{ include "zhiyuan.image" (dict "registry" .Values.global.registry "repo" .Values.images.conversationInit.repository "tag" .Values.images.conversationInit.tag "digest" .Values.images.conversationInit.digest) | quote }}}
            {{- if .Values.workspaceGateway.image }}
            # 未钉 spec.image 的新建 PersonalWorkspace 走此默认（覆盖编译期
            # 的 0.4.2 老默认——无 rooms/email 能力，见 2026-10-15 协作群事故）
            - {name: PERSONAL_WORKSPACE_IMAGE, value: {{ .Values.workspaceGateway.image | quote }}}
            {{- end }}
            - {name: HIBERNATION_IDLE_TIMEOUT_SECONDS, value: "1800"}
            {{- with .Values.runtimeDefaults.resources }}
            # 运行时容器默认 requests/limits（CR spec.resources 优先）。
            - {name: RUNTIME_DEFAULT_RESOURCES, value: {{ toJson . | quote }}}
            {{- end }}
            {{- with .Values.runtimeDefaults.securityContext }}
            # 运行时与 db-init 容器的 securityContext（db-init 不继承身份字段）。
            - {name: RUNTIME_SECURITY_CONTEXT, value: {{ toJson . | quote }}}
            {{- end }}
            {{- if .Values.channelGateway.enabled }}
            - {name: CHANNEL_GATEWAY_URL, value: "http://de-channel-gateway.{{ include "zhiyuan.ns" . }}.svc.cluster.local:8899"}
            {{- end }}
            {{- if .Values.workspaceAgent.microvmNodes }}
            - {name: WORKSPACE_MICROVM_NODES, value: {{ join "," .Values.workspaceAgent.microvmNodes | quote }}}
            - {name: WORKSPACE_MICROVM_SUBNET, value: {{ .Values.workspaceAgent.microvmSubnet | quote }}}
            {{- end }}
          args: ["--namespace", {{ include "zhiyuan.ns" . | quote }}, "--leader-elect"]
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
