{{- if and .Values.observability.enabled .Values.observability.auditShipper.enabled }}
{{- $obs := .Values.observability }}
{{- $ln := $obs.loggingNamespace }}
# Audit-event shipper：轮询 AEP/portal 管理 API，把结构化审计数据 bulk 进
# ES 的 zhiyuan-audit-* 索引（业务层审计轨迹；基础设施日志由 fluent-bit 负责）。
# 含模型健康快照与员工 model_failover —— 回答「哪个模型何时坏了、影响了谁」
# 不必再靠现场人肉。管理员口令走一次性 Secret（{{ $obs.auditShipper.credentialsSecret }}），不入 chart。
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-shipper-script
  namespace: {{ $ln }}
data:
  # 采集脚本本体只有一份：charts/zhiyuan-stack/files/ship.py（模板只做 include，
  # 不在 YAML 里再内联一份）。收编前的参考实例 k3s/audit-shipper.yaml 由
  # scripts/test_audit_shipper.py 保证与本文件逐字符一致。
  ship.py: |
{{ .Files.Get "files/ship.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-shipper
  namespace: {{ $ln }}
spec:
  schedule: {{ $obs.auditShipper.schedule | quote }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: shipper
              image: {{ $obs.auditShipper.image.repository }}:{{ $obs.auditShipper.image.tag }}
              command: ["python3", "/script/ship.py"]
              env:
                - {name: AEP_BASE_URL, value: "http://aep-control-service.aep-system.svc.cluster.local:8080"}
                - {name: PORTAL_BASE_URL, value: "http://de-portal.digital-employees.svc.cluster.local:8090"}
                - {name: ES_URL, value: {{ $obs.auditShipper.esURL | quote }}}
                - {name: AEP_DEPLOYMENT_ID, value: {{ .Values.aepStack.deploymentId | quote }}}
                - name: AEP_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: {{ $obs.auditShipper.credentialsSecret }}, key: AEP_ADMIN_PASSWORD}
              volumeMounts:
                - {name: script, mountPath: /script}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 64Mi}
          volumes:
            - name: script
              configMap: {name: audit-shipper-script}
{{- end }}
