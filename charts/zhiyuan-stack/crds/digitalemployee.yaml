---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: digitalemployees.digitalemployee.zhiyuan.io
spec:
  group: digitalemployee.zhiyuan.io
  names:
    kind: DigitalEmployee
    listKind: DigitalEmployeeList
    plural: digitalemployees
    shortNames:
    - de
    singular: digitalemployee
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.runtime.type
      name: Runtime
      type: string
    - jsonPath: .spec.runtime.model
      name: Model
      type: string
    - jsonPath: .status.memoryUser
      name: MemoryUser
      type: string
    - jsonPath: .status.runtimeAccount
      name: Account
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DigitalEmployee is one governed agent instance; the CR name is the
          business ID that memory and knowledge bind to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DigitalEmployeeSpec defines the desired state of a digital
              employee.
            properties:
              a2a:
                description: A2A optionally exposes this employee over the A2A delegation
                  contract.
                properties:
                  image:
                    description: Image of the a2a-adapter container.
                    type: string
                  maxDepth:
                    description: MaxDepth is the delegation chain depth limit (default
                      3).
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  nodePort:
                    description: NodePort exposes the adapter; 0 means ClusterIP only.
                    format: int32
                    maximum: 32767
                    minimum: 30000
                    type: integer
                required:
                - image
                type: object
              assets:
                description: |-
                  Assets enables the governed asset tools on this employee's runtime.
                  The operator renders the env the governance middleware gates on;
                  bindings, capabilities, and execution enforcement all live in the
                  AEP asset catalog, not here.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled turns the asset tools on. The runtime stays tool-less
                      otherwise — an employee without the toggle never sees them.
                    type: boolean
                type: object
              channels:
                description: |-
                  Channels toggles IM channel providers; credentials arrive at runtime
                  via the gateway admin API, not through the CR.
                properties:
                  feishu:
                    description: Feishu enables the Feishu channel.
                    type: boolean
                  feishuDomain:
                    description: |-
                      FeishuDomain overrides the Feishu open-platform endpoint the channel
                      talks to. Empty keeps the channel default (https://open.feishu.cn).
                      Point it at a protocol-level mock or a self-hosted gateway to exercise
                      the channel without real credentials.
                    type: string
                  feishuName:
                    description: |-
                      FeishuName is the bot's display name in Feishu groups. The channel
                      resolves its own bot open_id at startup and matches @-mentions by that
                      id; this name is the explicit fallback used when the lookup is
                      unavailable (or when bot_open_id is set manually). With neither, a
                      mention is never treated as addressing the bot.
                    type: string
                  wechat:
                    description: Wechat enables the WeChat QR/token channel (separate
                      from WeCom).
                    type: boolean
                  wecom:
                    description: Wecom enables the WeCom (企业微信) smart-bot channel.
                    type: boolean
                  wecomName:
                    description: |-
                      WecomName is the bot's display name on WeCom. @-mentions of this name
                      address the bot itself; the governance middleware tells the agent so
                      it never mistakes its own name for a delegation target.
                    type: string
                  wecomWsUrl:
                    description: |-
                      WecomWSURL overrides the WeCom bot websocket endpoint. Empty keeps the
                      SDK default (wss://openws.work.weixin.qq.com). The aibot client always
                      passes a TLS context, so only wss:// endpoints connect; a plain ws://
                      mock needs a TLS front end in front of it.
                    type: string
                type: object
              conversationStore:
                description: |-
                  ConversationStore centralizes conversation persistence (postgres)
                  or keeps it per-employee on the home volume (sqlite, default).
                properties:
                  backend:
                    default: sqlite
                    enum:
                    - sqlite
                    - postgres
                    type: string
                  database:
                    description: |-
                      Physical database selection when Backend=postgres. Empty provisions a
                      per-employee database (de_<name>); any other value names an explicit
                      database the operator creates on boot. The reserved word "shared" is
                      rejected at reconciliation (the legacy shared database is gone).
                    pattern: ^[a-z][a-z0-9_]{0,40}$
                    type: string
                type: object
              credentials:
                description: Credentials references the shared platform secret.
                properties:
                  name:
                    description: Name of the Secret in the employee namespace.
                    type: string
                required:
                - name
                type: object
              description:
                description: |-
                  Description is the business-layer purpose statement (用途说明);
                  the operator never interprets it.
                maxLength: 500
                type: string
              displayName:
                type: string
              email:
                description: |-
                  Email optionally gives this employee its own mailbox(es). The secret
                  named here must carry EMAIL_MAILBOXES (JSON array of mailbox configs
                  incl. credentials); the operator envFrom-injects it into the runtime
                  and the governance middleware registers the email tools when the env
                  is present. Portal is the writer of that secret.
                properties:
                  secretName:
                    description: |-
                      SecretName names a Secret in this namespace whose EMAIL_MAILBOXES key
                      holds the JSON mailbox array (label/address/imap/smtp/username/password).
                    type: string
                required:
                - secretName
                type: object
              governance:
                description: GovernanceSpec carries AEP governance middleware parameters.
                properties:
                  aepBaseURL:
                    type: string
                  apiServiceCreds:
                    type: string
                  defaultAEPUser:
                    type: string
                  deploymentID:
                    type: string
                  deploymentName:
                    description: DeploymentName is the AEP deployment's verified display
                      name.
                    type: string
                  governedTools:
                    items:
                      type: string
                    type: array
                  identitySource:
                    type: string
                  teamNames:
                    additionalProperties:
                      type: string
                    type: object
                required:
                - aepBaseURL
                - defaultAEPUser
                - deploymentID
                type: object
              hibernation:
                description: |-
                  Hibernation optionally lets the operator scale the runtime to zero
                  when idle (KEDA watches the portal database's wake/activity tables).
                  Disabled by default; employees with an IM channel that holds an
                  outbound connection (WeCom) must stay resident until the
                  channel-gateway lands.
                properties:
                  enabled:
                    type: boolean
                  idleTimeout:
                    description: |-
                      IdleTimeout is how long the employee stays up after the last
                      activity before scaling to zero (e.g. "30m", "2h").
                    pattern: ^[0-9]+[smh]$
                    type: string
                type: object
              knowledge:
                description: KnowledgeSpec wires the enterprise knowledge base (WeKnora)
                  via MCP.
                properties:
                  bases:
                    description: |-
                      Bases is the employee's explicit knowledge-base whitelist (WeKnora
                      kb ids plus display-name snapshots). Non-nil means an explicit
                      policy: the operator renders it into the governance middleware,
                      which denies knowledge_search calls outside the list (an empty
                      non-nil list denies every search). Nil means no policy configured:
                      the middleware treats that as a configuration error and
                      default-denies every knowledge tool with administrator guidance,
                      never an unrestricted bridge credential.
                      No omitempty: an explicitly empty list (deny every search) must
                      survive JSON round-trips; absent/null decodes back to nil (= no
                      policy, default-deny).
                    items:
                      description: |-
                        KnowledgeBaseRef references one WeKnora knowledge base by id with a
                        display-name snapshot for the console.
                      properties:
                        id:
                          description: ID is the WeKnora knowledge-base id.
                          type: string
                        name:
                          description: Name is the knowledge-base display name at
                            assignment time.
                          type: string
                      required:
                      - id
                      - name
                      type: object
                    maxItems: 200
                    type: array
                  mcpURL:
                    description: MCPURL of the WeKnora MCP bridge endpoint.
                    type: string
                  type:
                    description: Type of knowledge integration. Only "weknora" is
                      implemented.
                    enum:
                    - weknora
                    type: string
                required:
                - mcpURL
                - type
                type: object
              memory:
                description: MemorySpec configures long-term memory persistence.
                properties:
                  accountID:
                    description: AccountID is the OpenViking account the employee
                      user lives in.
                    type: string
                  maxInjectionChars:
                    format: int32
                    maximum: 100000
                    minimum: 256
                    type: integer
                  memoryScope:
                    default: instance
                    description: |-
                      MemoryScope selects how OpenViking memory is partitioned inside this
                      employee. "instance" (default) keeps the shipped behavior: memory
                      belongs to the employee instance, so every requester shares one space.
                      "requester" partitions memory per requesting user (DeerFlow's
                      memory_scope knob), so several humans on one instance stop sharing one
                      memory space. Instance-to-instance isolation is unchanged either way.
                    enum:
                    - instance
                    - requester
                    type: string
                  scoreThreshold:
                    maximum: 1
                    type: number
                  serverURL:
                    description: ServerURL of the OpenViking service.
                    type: string
                  sharedPeerID:
                    description: |-
                      SharedPeerID is an optional curated shared memory bucket, read in
                      addition to the requester's own memory when MemoryScope is "requester".
                      It must use the backend-reserved "df-shared-" prefix. Empty means
                      personal memory only. Ignored when MemoryScope is "instance".
                    type: string
                  singleTenantInstance:
                    default: false
                    description: |-
                      SingleTenantInstance maps every runtime user of this single-tenant
                      instance onto the employee's memory owner (per-request human identity
                      lives in governance, not in the memory tenant).
                    type: boolean
                  topK:
                    description: Retrieval tuning; zero values fall back to the backend
                      defaults.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  type:
                    description: Type of memory backend. Only "openviking" is implemented.
                    enum:
                    - openviking
                    type: string
                required:
                - accountID
                - serverURL
                - type
                type: object
              modelAccess:
                description: |-
                  ModelAccess explicitly links this employee to its own AEP agent account.
                  Omitted keeps legacy model access; owner/defaultAEPUser are never inferred.
                properties:
                  agentId:
                    maxLength: 256
                    minLength: 1
                    type: string
                required:
                - agentId
                type: object
                x-kubernetes-validations:
                - message: replace the employee to change its AEP agent identity
                  rule: self.agentId == oldSelf.agentId
              nodePort:
                description: NodePort exposes the runtime; 0 means ClusterIP only.
                format: int32
                maximum: 32767
                minimum: 30000
                type: integer
              owner:
                description: |-
                  Owner is the AEP user id of the employee's owner (set by the business
                  layer; the operator never interprets it).
                type: string
              ownerName:
                description: OwnerName is the owner's AEP username for display.
                type: string
              persistence:
                description: |-
                  Persistence makes the runtime home durable (threads, channel
                  credentials, auth DB survive pod restarts and image upgrades).
                properties:
                  enabled:
                    default: true
                    type: boolean
                  size:
                    default: 2Gi
                    description: Size of the home volume (minimum 1Gi).
                    type: string
                type: object
              replicas:
                default: 1
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              resources:
                description: |-
                  Resources overrides the runtime container's compute requests/limits.
                  Nil falls back to the operator default (RUNTIME_DEFAULT_RESOURCES,
                  rendered from the chart's runtimeDefaults.resources); when neither is
                  set the container carries no requests/limits (legacy behaviour).
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtime:
                description: RuntimeSpec selects the execution engine and the model
                  route.
                properties:
                  apiKeyEnv:
                    description: |-
                      ApiKeyEnv names the credentials-Secret env var holding the provider
                      API key. Defaults to DEER_BENCH_API_KEY. Legacy form of
                      Models[0].apiKeyEnv.
                    type: string
                  image:
                    description: |-
                      Image is the container image for the runtime (must embed the
                      governance middleware and MCP tooling).
                    type: string
                  model:
                    description: |-
                      Model is the wire model id routed by the Higress model gateway
                      (e.g. bench-glm). Never a provider-native model name. Legacy form of
                      Models[0]; kept for existing CRs.
                    type: string
                  modelBaseURL:
                    description: |-
                      ModelBaseURL is the model API base URL. Defaults to the in-cluster
                      Higress gateway when empty. Legacy form of Models[0].baseURL.
                    type: string
                  models:
                    description: |-
                      Models lists the LLM routes the runtime may use, in priority order:
                      the first entry is the default the runtime picks when a caller does
                      not name one, later entries are selectable by name (DeerFlow resolves
                      per-request and per-subagent model choices against this list — it is
                      selection, not automatic failover). When empty the legacy singular
                      fields below define the single model.
                    items:
                      description: RuntimeModel is one LLM route in the runtime's
                        model list.
                      properties:
                        apiKeyEnv:
                          description: |-
                            ApiKeyEnv names the credentials-Secret env var holding the provider
                            API key.
                          type: string
                        baseURL:
                          description: |-
                            BaseURL is the model API base URL. For anthropic models served by
                            the AEP registry this is <gateway>/<model-id>.
                          type: string
                        name:
                          description: |-
                            Name is the wire model id (AEP model id) agents and threads
                            reference; also the selection key inside the runtime config.
                          type: string
                        nativeModel:
                          description: |-
                            NativeModel is the provider-native model id sent upstream. Defaults
                            to Name.
                          type: string
                        provider:
                          description: 'Provider selects the protocol family: "openai"
                            or "anthropic".'
                          enum:
                          - openai
                          - anthropic
                          type: string
                        reasoning:
                          description: |-
                            Reasoning declares the model's thinking behavior so the runtime does
                            not have to infer it (DeerFlow turns thinking off for undeclared
                            models even when the upstream emits reasoning_content). Derived from
                            the AEP catalog's reasoningCompatibility.
                          properties:
                            history:
                              description: |-
                                History policy for reasoning across turns: preserve keeps
                                reasoning_content on assistant messages (required by
                                requiresReasoningContentOnAssistantMessages upstreams), clear drops
                                it. Empty leaves the runtime default.
                              enum:
                              - preserve
                              - clear
                              type: string
                            thinking:
                              description: |-
                                Thinking policy: unsupported (never), optional (caller toggles,
                                default on), required (always on). Mapped from a declared
                                thinkingFormat.
                              enum:
                              - unsupported
                              - optional
                              - required
                              type: string
                          type: object
                      required:
                      - name
                      - provider
                      type: object
                    type: array
                  nativeModel:
                    description: |-
                      NativeModel is the provider-native model id behind the wire name
                      (Model stays the stable wire id agents and threads reference).
                      Defaults to Model (Higress passthrough). Legacy form of
                      Models[0].nativeModel.
                    type: string
                  provider:
                    description: |-
                      Provider selects the model protocol family. "openai" (default) keeps
                      the Higress-routed OpenAI-compatible path; "anthropic" speaks the
                      Anthropic wire protocol — the AEP model registry serves it under a
                      per-model path prefix (http://<gateway>/<model-id>).
                    enum:
                    - openai
                    - anthropic
                    type: string
                  type:
                    description: Type of the execution engine. Only "deerflow" is
                      implemented.
                    enum:
                    - deerflow
                    type: string
                required:
                - image
                - model
                - type
                type: object
              skills:
                description: |-
                  Skills are the AEP skills enabled for this employee (set by the
                  business layer; the operator never interprets them). Each entry
                  pins the skill and the published version chosen at creation.
                items:
                  description: |-
                    SkillRef registers one AEP skill enabled for the employee, pinned to the
                    published version chosen at creation.
                  properties:
                    id:
                      description: ID is the AEP skill identifier (server-generated
                        slug).
                      type: string
                    name:
                      description: Name is the skill display name at assignment time.
                      type: string
                    version:
                      description: Version is the published skill version to use.
                      type: string
                  required:
                  - id
                  - name
                  - version
                  type: object
                maxItems: 200
                type: array
              team:
                description: |-
                  Team scopes the employee to a department. Members of this AEP team
                  can see and converse with the employee in addition to the owner;
                  admins bypass all team scoping. Empty means visible to everyone
                  (legacy behavior for employees created before team scoping).
                type: string
              teamName:
                description: TeamName is the owning team's verified AEP display-name
                  snapshot.
                type: string
              visibility:
                description: |-
                  Visibility is the employee's explicit open scope (who may see and
                  converse with it), enforced by the business layer. Nil keeps the
                  legacy owner/team rules.
                properties:
                  mode:
                    description: |-
                      Mode selects the scope: "all" opens the employee to every user,
                      "restricted" limits it to the listed teams and users.
                    enum:
                    - all
                    - restricted
                    type: string
                  teams:
                    description: Teams lists AEP teams whose members may use the employee.
                    items:
                      description: |-
                        SubjectRef references one AEP subject (team or user) by id with a
                        display-name snapshot.
                      properties:
                        id:
                          description: ID is the AEP team or user id.
                          type: string
                        name:
                          description: Name is the display name at assignment time.
                          type: string
                      required:
                      - id
                      - name
                      type: object
                    maxItems: 100
                    type: array
                  users:
                    description: Users lists AEP users who may use the employee.
                    items:
                      description: |-
                        SubjectRef references one AEP subject (team or user) by id with a
                        display-name snapshot.
                      properties:
                        id:
                          description: ID is the AEP team or user id.
                          type: string
                        name:
                          description: Name is the display name at assignment time.
                          type: string
                      required:
                      - id
                      - name
                      type: object
                    maxItems: 500
                    type: array
                required:
                - mode
                type: object
            required:
            - credentials
            - governance
            - runtime
            type: object
          status:
            description: DigitalEmployeeStatus defines the observed state of a digital
              employee.
            properties:
              memoryUser:
                description: MemoryUser is the OpenViking user provisioned for this
                  employee.
                type: string
              message:
                description: Message carries the last error detail when Phase == Error.
                type: string
              modelIdentity:
                description: |-
                  ModelIdentity is a credential-free observation of the owned SA. It is
                  neither a model grant nor evidence of gateway authorization/adoption.
                properties:
                  agentId:
                    maxLength: 256
                    minLength: 1
                    type: string
                  audience:
                    maxLength: 256
                    minLength: 1
                    type: string
                  deploymentId:
                    maxLength: 80
                    minLength: 1
                    type: string
                  employeeUid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    maxLength: 128
                    minLength: 1
                    type: string
                  observedGeneration:
                    format: int64
                    minimum: 1
                    type: integer
                  serviceAccountName:
                    maxLength: 253
                    minLength: 1
                    type: string
                  serviceAccountUid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - agentId
                - audience
                - deploymentId
                - employeeUid
                - observedGeneration
                - serviceAccountName
                - serviceAccountUid
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: DigitalEmployeePhase describes the reconciliation phase.
                enum:
                - Pending
                - Ready
                - Sleeping
                - Error
                type: string
              runtimeAccount:
                description: |-
                  RuntimeAccount is the bootstrap state of the employee's runtime
                  account: the per-instance DeerFlow admin plus the owner account and
                  PAT provisioned through the runtime auth API (see the operator's
                  ensureRuntimeAccount). Ready means the PAT in the
                  de-<name>-runtime-creds Secret authenticates against the runtime.
                enum:
                - Pending
                - Ready
                - Failed
                - Unsupported
                type: string
              runtimeAccountMessage:
                description: |-
                  RuntimeAccountMessage carries the last runtime-account detail
                  (failure reason, upgrade hint, …).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
