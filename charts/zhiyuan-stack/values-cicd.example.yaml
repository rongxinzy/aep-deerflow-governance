# cicd overlay example — copy to values-cicd.local.yaml and fill the
# credentials (never commit the local copy).
global:
  # 2026-10-07 registry standardization: nodes pull ONLY from the in-cluster
  # Harbor (harbor.zhiyuan.local:30443, cert-manager TLS); Harbor proxies
  # external upstreams (dockerhub/quay projects) and the jfrog archive.
  # The legacy mirror mapping in each node's registries.yaml falls back to
  # 172.18.5.251:8081 for old tags.
  registry: "harbor.zhiyuan.local:30443/zhiyuan"

aep:
  adminUserId: "<aep-admin-user-uuid>"

# AEP 控制面（aep-system）——2026-10-07 起由本 chart 接管（原手贴
# aep-stack.yaml）。非敏感现况值在此记录，敏感值占位符：
# 真值写在同目录 values-cicd.local.yaml（gitignored）。
aepStack:
  enabled: true
  # TODO(产品决策)：桌面端广播地址现为节点 IP:30182，待换稳定入口域名。
  agentControlAdvertiseUrl: "http://172.18.5.188:30182"
  deploymentId: demo
  deploymentName: "Demo Deployment"
  environment: development
  # 活体现值 http://10.43.71.90:8090/v1 是 authorizer 的 ClusterIP——能过
  # control-service 的启动校验（拒绝 .svc.cluster.local），但集群外客户端
  # 路由不到 10.43.x.x，实际不可用。按校验器意图收敛为节点 IP + NodePort
  # （30181）。注意：这是外部 agent 实际使用的数据面入口地址。
  modelGatewayBaseUrl: "http://172.18.5.188:30181/v1"
  # 以下敏感值必须与集群现值一致（存量迁移：从 aep-*-config CM 回填到
  # values-cicd.local.yaml），否则下次 upgrade 会回退引导口令/密钥。
  bootstrapAdminUsername: admin
  bootstrapAdminPassword: "<from-values-cicd-local>"
  credentialMasterKeyBase64: "<from-values-cicd-local>"
  signingKeyBase64: "<from-values-cicd-local>"
  databaseUrl: "postgres://aep:<from-values-cicd-local>@postgres:5432/aep?sslmode=disable"
  dataPlaneReconcilerToken: "<from-values-cicd-local>"
  gatewayLicenseStatusToken: "<from-values-cicd-local>"
  # licenseTrustedKeysFile 是文件路径（非敏感），用 values.yaml 默认值
  licenseCustomerId: customer-internal-test
  postgres: {password: "<from-values-cicd-local>"}

# WeKnora 知识库（vendored 子图，2026-10-07 收编）。活体现况：
#   - 三个数据卷已迁 Longhorn（-lh claims），旧 local-path PVC 保留为备份；
#   - 镜像是 Harbor DNS（weknora release 里存量的用户 values 仍是旧 jfrog
#     地址——收编升级时以本 chart 的值为准，勿回放旧 values）；
#   - SSRF 白名单与 app Recreate 是活体状态（Recreate 已在 values.yaml 默认）。
# 敏感项（dbPassword/redisPassword/jwtSecret/systemAesKey、mcp 凭据）在
# values-cicd.local.yaml，收编前从集群回填。
weknora:
  enabled: true
  namespace: weknora
  fullnameOverride: weknora
  app:
    extraEnv:
      - name: SSRF_WHITELIST_EXTRA
        value: higress-gateway.higress-system.svc.cluster.local,embed-server.memory-system.svc.cluster.local
  postgresql:
    persistence: {existingClaim: weknora-postgres-lh}
  redis:
    persistence: {existingClaim: weknora-redis-lh}
  dataFiles:
    persistence: {existingClaim: weknora-data-files-lh}
  mcp:
    apiKey: "<from-values-cicd-local>"
    serverAuthToken: "<from-values-cicd-local>"
  secrets:
    dbPassword: "<from-values-cicd-local>"
    redisPassword: "<from-values-cicd-local>"
    jwtSecret: "<from-values-cicd-local>"
    systemAesKey: "<from-values-cicd-local>"

models:
  anthropic:
    apiKey: "<bigmodel-api-key>"

# DEPLOY-DRIFT GUARD: these image tags are what the cicd cluster actually
# runs. Day-to-day deploys may use `kubectl set image`, but every release
# MUST sync tags here (and into values-cicd.local.yaml) — otherwise the
# next `helm upgrade` silently rolls components back to whatever
# values.yaml last pinned (2026-10-06 audit: chart said 0.13.0/0.14.0/
# 0.8.3/v18 while the cluster ran 0.18.0/0.18.0/0.10.2/v25). Same rule
# now covers the migration state: PVC claim names (postgres-data-lh /
# openviking-data-lh), RWO-PVC workloads must keep `strategy: Recreate`,
# and every image ref must render through the Harbor DNS registry above.
images:
  operator: { repository: rongxinzy/de-operator, tag: "0.18.0" }
  portal: { repository: rongxinzy/de-portal, tag: "0.18.0" }
  chatUI: { repository: rongxinzy/deerflow-chat-ui, tag: "0.1.8" }
  adminConsole: { repository: rongxinzy/de-admin-console, tag: "0.10.2" }
  # v25 = governance TypedDict fix (tool interception live); PORTAL_RUNTIME_IMAGE
  # (new-employee default) renders from this entry since 2026-10-06.
  runtime: { repository: rongxinzy/deerflow-gov, tag: "v25" }

memory:
  openviking:
    rootAPIKey: "<openviking-root-key>"
    # cicd memory extraction rides the on-prem Qwen server DIRECTLY, not
    # through Higress: the model gateway's openai-compat conversion route
    # is shadowed by a legacy manual /v1/chat/completions ingress
    # (longest-prefix wins), so the derived route is unreachable — recorded
    # as an AEP gap. Qwen3.8-Flash-Next is a thinking model: without
    # enable_thinking=false the answer stays in reasoning_content and
    # extraction returns 0 hits. Revisit apiBase when the route shadowing
    # is fixed. (2026-10-06; matches the live openviking-config CM.)
    vlm:
      apiBase: http://172.18.6.119:8080/v1
      model: Qwen3.8-Flash-Next
      apiKey: "none"
      timeout: 300
      extraRequestBody:
        chat_template_kwargs:
          enable_thinking: false

employees:
  - name: sales-helper
    displayName: 销售助理
    wecom: true
    wecomName: 数字员工测试
  - name: finance-helper
    displayName: 财务助理
  - name: production-helper
    displayName: 生产助理
  - name: rd-helper
    displayName: 研发助理
  - name: admin-helper
    displayName: 行政助理
