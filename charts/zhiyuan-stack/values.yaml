# Defaults; per-environment overrides live in values-<env>.local.yaml files
# that are gitignored (they carry credentials).

global:
  # Image registry base for the zhiyuan-built images. ghcr.io is the
  # version source (CI publishes there); the cicd cluster pulls from its
  # own Harbor instead (2026-10-07 registry standardization): nodes talk
  # ONLY to the in-cluster Harbor over TLS (cert-manager-issued cert,
  # /etc/hosts or DNS resolves harbor.zhiyuan.local), Harbor proxies
  # external upstreams and the legacy jfrog archive. Never hardcode IPs
  # in image refs — swap the DNS name per environment instead.
  registry: "harbor.zhiyuan.local:30443/zhiyuan"
  # Third-party images that only exist on the intranet registry.
  intranetRegistry: "harbor.zhiyuan.local:30443/zhiyuan"
  namespaces:
    main: digital-employees
    memory: memory-system

images:
  operator: { repository: rongxinzy/de-operator, tag: "0.14.0" }
  portal: { repository: rongxinzy/de-portal, tag: "0.13.0" }
  chatUI: { repository: rongxinzy/deerflow-chat-ui, tag: "0.1.8" }
  adminConsole: { repository: rongxinzy/de-admin-console, tag: "0.8.3" }
  # runtime images are big and version rarely; the lineage lives on ghcr
  runtime: { repository: rongxinzy/deerflow-gov, tag: "v18" }
  openviking: { repository: "harbor.zhiyuan.local:30443/zhiyuan/openviking", tag: "0.4.21" }
  embedServer: { repository: "harbor.zhiyuan.local:30443/zhiyuan/embed-server", tag: "0.1.0" }
  # AEP control plane + datastore images (ns aep-system, see templates/aep-stack.yaml)
  postgres: { repository: postgres, tag: "17.6-alpine" }
  rustfs: { repository: rustfs, tag: "1.0.0" }
  aepControlService: { repository: aep-control-service, tag: "0.8.0" }
  aepAgentControl: { repository: aep-agent-control, tag: "0.1.0" }
  aepGatewayAuthorizer: { repository: aep-gateway-authorizer, tag: "0.2.0" }
  aepGatewayReconciler: { repository: aep-gateway-reconciler, tag: "0.4.3" }

# AEP 控制面（ns aep-system）。对象形状/探针/环境键名与 cicd 活体一致
# （2026-10-07 从活体提取入库）；敏感值一律占位，真值只在
# values-<env>.local.yaml（gitignored）。
aepStack:
  enabled: true
  controlNodePort: 30180
  authorizerNodePort: 30181
  agentControlNodePort: 30182
  # 桌面端 metadata 广播的 agent-control 地址（需外部可达）。产品决策待定：
  # 应替换为稳定入口域名；部署环境必须显式覆盖本项。
  agentControlAdvertiseUrl: "http://aep-agent-control.aep-system.svc.cluster.local:8080"
  deploymentId: demo
  deploymentName: "Demo Deployment"
  environment: development
  logFormat: text
  logLevel: info
  maxResidentAgents: "100"
  modelAccessTTL: 15m
  # 模型网关地址 = gateway-authorizer（校验 model JWT 后转发 Higress），
  # 不是 Higress 本身；Higress 无 :8090 端口，指错会直接断模型链路。
  modelGatewayBaseUrl: "http://aep-gateway-authorizer.aep-system.svc.cluster.local:8090/v1"
  gatewayUpstreamUrl: "http://higress-gateway.higress-system.svc.cluster.local:80"
  gatewayRequireEntitlement: "false"
  reconcilerInterval: 15s
  reconcilerTenants: demo
  # ---- credentials（values-<env>.local.yaml 覆盖）----
  bootstrapAdminUsername: admin
  bootstrapAdminPassword: "<set-in-local-values>"
  bootstrapEnterpriseId: demo
  bootstrapEnterpriseName: "Demo Enterprise"
  credentialMasterKeyBase64: "<base64-32-bytes>"
  signingKeyBase64: "<base64-32-bytes>"
  databaseUrl: "postgres://aep:<db-password>@postgres:5432/aep?sslmode=disable"
  dataPlaneReconcilerToken: "<token>"
  gatewayLicenseStatusToken: "<token>"
  licenseFilePath: /var/run/aep-license/license.zylic
  licenseTrustedKeysFile: "<json>"
  licenseCustomerId: customer-internal-test
  minioAccessKey: minioadmin
  minioSecretKey: minioadmin
  minioBucket: aep-skills
  minioEndpoint: rustfs:9000
  postgres: {database: aep, user: aep, password: "<db-password>", storage: 5Gi, storageClass: longhorn}
  rustfs: {storage: 5Gi, storageClass: longhorn}

# de-channel-gateway: the always-on platform websocket leg for IM channels
# (enables hibernation for WeCom employees). Bot credentials live in the
# de-channel-connections Secret as JSON, never in values.
channelGateway:
  enabled: false
  image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/de-channel-gateway", tag: "0.1.0" }
  connectionsSecret: de-channel-connections
  port: 8899

aep:
  baseURL: http://aep-control-service.aep-system.svc.cluster.local:8080
  deploymentID: demo
  # AEP admin user id; employees use it as the governance default user.
  adminUserId: ""

# Created out-of-band (kept out of the chart on purpose): de-platform-creds
# (OPENVIKING_ROOT_API_KEY, WEKNORA_MCP_BEARER, GOV_*, DEER_BENCH_API_KEY,
# BIGMODEL_API_KEY dummy, WEKNORA_API_KEY) and de-portal-db (PORTAL_DB_URL).
secrets:
  platformCreds: de-platform-creds
  portalDB: de-portal-db

portal:
  policyMode: approval
  quotaPerUser: "2"
  adminUsers: admin
  adminRoles: admin,platform-admin
  nodePort: 30190

chatUI:
  gatewayBaseURL: http://de-portal.digital-employees.svc.cluster.local:8090
  nodePort: 30195

adminConsole:
  enabled: true
  aepBaseURL: http://aep-control-service.aep-system.svc.cluster.local:8080
  portalBaseURL: http://de-portal.digital-employees.svc.cluster.local:8090
  nodePort: 30196
  # WeKnora management UI proxied by the console container (second port).
  weknoraNodePort: 30163
  weknoraUIURL: http://frontend.weknora.svc.cluster.local

# Online GLM through Higress: Anthropic passthrough for the runtime
# (ChatAnthropic) plus the openai<->anthropic conversion route for
# OpenViking's VLM. apiKey is a credential — keep it in the local values
# file, never commit it.
models:
  anthropic:
    enabled: true
    wireName: bench-glm
    nativeModel: glm-5.3-flash
    apiKey: ""
    upstreamDomain: open.bigmodel.cn

memory:
  enabled: true
  openviking:
    account: zhiyuan
    rootAPIKey: ""        # credential — local values file only
    storage: 10Gi
    vlm:
      # in-cluster Higress gateway speaks openai to the VLM
      apiBase: http://higress-gateway.higress-system.svc.cluster.local/v1
      model: glm-5.3-flash
      # timeout (seconds, default 120): extraction prompts are long — slow
      # on-prem VLMs need 300.
      # apiKey: sent as the bearer; Higress routes inject the real
      # credential server-side (default "aep-managed-by-higress").
      # extraRequestBody: merged into every VLM chat request. Thinking-mode
      # models must disable thinking or the answer lands in
      # reasoning_content and OpenViking extracts nothing — set
      # {chat_template_kwargs: {enable_thinking: false}} for them.
      extraRequestBody: {}
    embedding:
      apiBase: http://embed-server:8080/v1
      model: bge-small-zh-v1.5
      dimension: 512

# Digital employees. wecom requires the bot's WS session (single instance
# cluster-wide); knowledge is absent until WeKnora is wired per employee.
conversationStore:
  backend: postgres

employees: []
