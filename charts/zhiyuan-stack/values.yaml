# Defaults; per-environment overrides live in values-<env>.local.yaml files
# that are gitignored (they carry credentials).

global:
  # Image registry base for the zhiyuan-built images. ghcr.io is the
  # version source (CI publishes there); the cicd cluster pulls from its
  # own Harbor instead (2026-10-07 registry standardization): nodes talk
  # ONLY to the in-cluster Harbor over TLS (cert-manager-issued cert,
  # /etc/hosts or DNS resolves harbor.zhiyuan.local), Harbor proxies
  # external upstreams and the legacy jfrog archive. Never hardcode IPs
  # in image refs — swap the DNS name per environment instead.
  registry: "harbor.zhiyuan.local:30443/zhiyuan"
  # Third-party images that only exist on the intranet registry.
  intranetRegistry: "harbor.zhiyuan.local:30443/zhiyuan"
  namespaces:
    main: digital-employees
    memory: memory-system

images:
  operator: { repository: rongxinzy/de-operator, tag: "0.14.0" }
  portal: { repository: rongxinzy/de-portal, tag: "0.13.0" }
  chatUI: { repository: rongxinzy/deerflow-chat-ui, tag: "0.1.8" }
  adminConsole: { repository: rongxinzy/de-admin-console, tag: "0.8.3" }
  # runtime images are big and version rarely; the lineage lives on ghcr
  runtime: { repository: rongxinzy/deerflow-gov, tag: "v18" }
  openviking: { repository: "harbor.zhiyuan.local:30443/zhiyuan/openviking", tag: "0.4.21" }
  embedServer: { repository: "harbor.zhiyuan.local:30443/zhiyuan/embed-server", tag: "0.1.0" }
  # AEP control plane + datastore images (ns aep-system, see templates/aep-stack.yaml)
  postgres: { repository: postgres, tag: "17.6-alpine" }
  rustfs: { repository: rustfs, tag: "1.0.0" }
  aepControlService: { repository: aep-control-service, tag: "0.8.0" }
  aepAgentControl: { repository: aep-agent-control, tag: "0.1.0" }
  aepGatewayAuthorizer: { repository: aep-gateway-authorizer, tag: "0.2.0" }
  aepGatewayReconciler: { repository: aep-gateway-reconciler, tag: "0.4.3" }
  # zhiyuan's MCP bridge in front of WeKnora (see templates/weknora-mcp.yaml)
  weknoraMcp: { repository: weknora-mcp, tag: "0.1.0" }

# AEP 控制面（ns aep-system）。对象形状/探针/环境键名与 cicd 活体一致
# （2026-10-07 从活体提取入库）；敏感值一律占位，真值只在
# values-<env>.local.yaml（gitignored）。
aepStack:
  enabled: true
  controlNodePort: 30180
  authorizerNodePort: 30181
  agentControlNodePort: 30182
  # 对外广播的 agent-control 地址（桌面端从 metadata 读取后直连）——必须
  # 从集群外可达，不能是集群内 DNS。产品决策待定：稳定入口域名。
  # 占位符会在渲染期被 fail-fast 拦截（占位符守卫，aep-stack.yaml 顶部）。
  agentControlAdvertiseUrl: "<client-reachable-agent-control-url>"
  deploymentId: demo
  deploymentName: "Demo Deployment"
  environment: development
  logFormat: text
  logLevel: info
  maxResidentAgents: "100"
  modelAccessTTL: 15m
  # 模型网关地址 = gateway-authorizer 的**对外可达**地址（校验 model JWT
  # 后转发 Higress）——不是 Higress 本身（无 :8090 端口），也**不能是集群内
  # DNS**：control-service 启动校验（clientReachableGatewayHost 拒绝
  # .svc.cluster.local / 单标签名）会让控制面 CrashLoop。cicd 用节点
  # IP:30181（authorizer NodePort），见 values-cicd.example.yaml。
  modelGatewayBaseUrl: "<client-reachable-model-gateway-url>"
  # 模型健康状态迁移的推送 webhook（企微群机器人 text 格式；AEP 侧
  # AEP_MODEL_HEALTH_WEBHOOK，仅状态变化时推送一次）。空 = 仅落库/审计/UI
  # （与旧行为一致）。真实 URL 属凭据：只放 values-<env>.local.yaml。
  modelHealthWebhook: ""
  gatewayUpstreamUrl: "http://higress-gateway.higress-system.svc.cluster.local:80"
  gatewayRequireEntitlement: "false"
  reconcilerInterval: 15s
  reconcilerTenants: demo
  # ---- credentials（values-<env>.local.yaml 覆盖）----
  bootstrapAdminUsername: admin
  bootstrapAdminPassword: "<set-in-local-values>"
  bootstrapEnterpriseId: demo
  bootstrapEnterpriseName: "Demo Enterprise"
  credentialMasterKeyBase64: "<base64-32-bytes>"
  signingKeyBase64: "<base64-32-bytes>"
  databaseUrl: "postgres://aep:<db-password>@postgres:5432/aep?sslmode=disable"
  dataPlaneReconcilerToken: "<token>"
  gatewayLicenseStatusToken: "<token>"
  licenseFilePath: /var/run/aep-license/license.zylic
  # 这是**文件路径**（挂载的 aep-license Secret 内文件），不是密钥内容
  licenseTrustedKeysFile: /var/run/aep-license/license-trusted-keys.json
  licenseCustomerId: customer-internal-test
  # RustFS 与两个 AEP 服务共用；只在 gitignored local values 中配置真实凭据。
  minioAccessKey: "<set-in-local-values>"
  minioSecretKey: "<set-in-local-values>"
  minioBucket: aep-skills
  minioEndpoint: rustfs:9000
  postgres: {database: aep, user: aep, password: "<db-password>", storage: 5Gi, storageClass: longhorn}
  rustfs: {storage: 5Gi, storageClass: longhorn}

# WeKnora 知识库（vendored 子图 charts/weknora，2026-10-07 收编，见该目录
# VENDORING.md）。命名固定 weknora-*（fullnameOverride）：父 release 名会让
# 子图默认渲染成 zhiyuan-weknora-*，与活体和交叉引用
# （frontend.weknora.svc.cluster.local 等）不符。
weknora:
  enabled: true
  namespace: weknora
  fullnameOverride: weknora
  # Deployment selector label（不可变）：收编进父 release（zhiyuan）时必须
  # 保持活体的 instance=weknora，否则 selector patch 会被 API server 拒绝。
  instanceName: weknora
  # app 挂 RWO data-files 卷 → Recreate（RWO 铁律，2026-10-06 事故后固化）
  app:
    strategy: {type: Recreate}
  # ---- 敏感项：仅 values-<env>.local.yaml ----
  secrets:
    dbPassword: ""
    redisPassword: ""
    jwtSecret: ""
    systemAesKey: ""
  mcp:
    enabled: true
    # 留空时由模板按 namespace 构造 http://app.<ns>.svc.cluster.local:8080/api/v1
    baseURL: ""
    port: 8830
    apiKey: ""           # WeKnora 租户 API key —— local values only
    serverAuthToken: ""  # 与 de-platform-creds 的 WEKNORA_MCP_BEARER 一致 —— local values only

# de-channel-gateway: the always-on platform websocket leg for IM channels
# (enables hibernation for WeCom employees). Bot credentials live in the
# de-channel-connections Secret as JSON, never in values; the same file carries
# each employee's caller credential (caller_credential: token/expires_at/
# operations) that the gateway requires on /inbox, /ack and /send — see
# channel-gateway/PROTOCOL.md.
channelGateway:
  enabled: false
  image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/de-channel-gateway", tag: "0.1.0" }
  connectionsSecret: de-channel-connections
  port: 8899

aep:
  baseURL: http://aep-control-service.aep-system.svc.cluster.local:8080
  deploymentID: demo
  # AEP admin user id; employees use it as the governance default user.
  adminUserId: ""

# Created out-of-band (kept out of the chart on purpose): de-platform-creds
# (OPENVIKING_ROOT_API_KEY, WEKNORA_MCP_BEARER, GOV_*, DEER_BENCH_API_KEY,
# BIGMODEL_API_KEY dummy, WEKNORA_API_KEY) and de-portal-db (PORTAL_DB_URL).
secrets:
  platformCreds: de-platform-creds
  portalDB: de-portal-db

portal:
  policyMode: approval
  quotaPerUser: "2"
  adminUsers: admin
  adminRoles: admin,platform-admin
  # Platform default model for employees created without an explicit model
  # pick (the workbench apply form has no model field). Validated against
  # the live model catalog at apply time — a stale value fails the apply
  # instead of creating an employee that cannot converse. 2026-10-08 real
  # check: bench-glm is DISABLED in the cicd catalog; every existing
  # employee rides bench-qwen38-fast, which is also this default.
  defaultModel: bench-qwen38-fast
  nodePort: 30190
  # Enable only after provisioning the tenant-scoped WeKnora API key in
  # secrets.platformCreds. Values contain identifiers, never credentials.
  managedKnowledge:
    enabled: false
    tenantID: ""
    embeddingModelID: ""
    apiKeySecretField: WEKNORA_KNOWLEDGE_API_KEY
    apiURL: http://app.weknora.svc.cluster.local:8080
    mcpURL: http://weknora-mcp.weknora.svc.cluster.local:8830/mcp
  # Model failover watcher (productized, deployment-configurable). The
  # fallback chain itself is deployment DATA, not code: it ships EMPTY
  # (AEP deployment setting modelFallbackIds, or the control plane's
  # AEP_MODEL_FALLBACK_IDS environment default) — until an operator
  # configures a chain the watcher never switches anyone, while employees
  # already on a fallback still restore when their original model recovers.
  # These knobs control cadence and hysteresis: a hard credential/access
  # failure switches immediately; transient failures must persist for
  # minUnhealthySeconds; the original must stay healthy for
  # minHealthySeconds before it is restored. intervalSeconds 0 disables the
  # watcher entirely.
  failover:
    intervalSeconds: 60
    minUnhealthySeconds: 300
    minHealthySeconds: 1200

# 2026-10-10 起停用：员工对话由独立前端 zhiyuanBotUI（30202）承载，
# chat-ui（30195）与 portal /chat 入口页不再是产品入口。保留模板与镜像
# 条目以便回滚，默认不部署。
chatUI:
  enabled: false
  gatewayBaseURL: http://de-portal.digital-employees.svc.cluster.local:8090
  nodePort: 30195

adminConsole:
  enabled: true
  aepBaseURL: http://aep-control-service.aep-system.svc.cluster.local:8080
  portalBaseURL: http://de-portal.digital-employees.svc.cluster.local:8090
  nodePort: 30196
  # WeKnora management UI proxied by the console container (second port).
  weknoraNodePort: 30163
  weknoraUIURL: http://frontend.weknora.svc.cluster.local
  # Companion messenger (Pi Durable 搭档) embedded as the workbench home iframe.
  companionBaseURL: http://pi-companion.digital-employees.svc.cluster.local

# Online GLM through Higress: Anthropic passthrough for the runtime
# (ChatAnthropic) plus the openai<->anthropic conversion route for
# OpenViking's VLM. apiKey is a credential — keep it in the local values
# file, never commit it.
models:
  anthropic:
    enabled: true
    wireName: bench-glm
    nativeModel: glm-5.3-flash
    apiKey: ""
    upstreamDomain: open.bigmodel.cn

memory:
  enabled: true
  openviking:
    account: zhiyuan
    # memoryScope on the DigitalEmployee CR. "instance" (default) keeps the
    # shipped behaviour: memory belongs to the employee instance, so everyone
    # using it shares one space. "requester" partitions memory per requesting
    # user (FR-ME-02) — requires an operator that renders memory_scope.
    scope: instance
    # Optional curated shared bucket read in addition to a requester's own
    # memory when scope=requester. Must start with "df-shared-"; empty means
    # personal memory only. Ignored when scope=instance.
    sharedPeerID: ""
    rootAPIKey: ""        # credential — local values file only
    storage: 10Gi
    vlm:
      # in-cluster Higress gateway speaks openai to the VLM
      apiBase: http://higress-gateway.higress-system.svc.cluster.local/v1
      model: glm-5.3-flash
      # timeout (seconds, default 120): extraction prompts are long — slow
      # on-prem VLMs need 300.
      # apiKey: sent as the bearer; Higress routes inject the real
      # credential server-side (default "aep-managed-by-higress").
      # extraRequestBody: merged into every VLM chat request. Thinking-mode
      # models must disable thinking or the answer lands in
      # reasoning_content and OpenViking extracts nothing — set
      # {chat_template_kwargs: {enable_thinking: false}} for them.
      extraRequestBody: {}
    embedding:
      apiBase: http://embed-server:8080/v1
      model: bge-small-zh-v1.5
      dimension: 512

# Observability 底座（2026-10-09 从 cicd 活体产品化收编）：Prometheus+Grafana+
# 节点/集群指标、告警规则与评估器、ES+Kibana+fluent-bit 日志聚合、audit-shipper
# 审计快照、节点日志体积硬上限。任何环境 helm 一装即有；告警 webhook 未配置时
# 评估器只把 firing 集合打到 pod 日志（不推送）。
observability:
  # 默认关闭 = opt-in。新环境置 true 即得全套（指标/日志/审计/告警/日志上限）；
  # 已在跑 k3s/*.yaml 实例的环境（如 cicd）必须先把既有对象 helm 收编
  # （加 meta.helm.sh/release-* 标注）再置 true，否则 helm upgrade 会因
  # "already exists" 冲突。步骤见 chart README「Observability 底座」。
  enabled: false
  monitoringNamespace: monitoring
  loggingNamespace: logging
  prometheus:
    image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/prom/prometheus", tag: "v3.5.0" }
    retention: 7d
    scrapeInterval: 15s
    # 指标属可再生软数据：默认 local-path，不受 Longhorn attach 故障面牵连。
    storage: { size: 10Gi, storageClass: local-path }
  grafana:
    image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/grafana/grafana", tag: "12.0.0" }
    nodePort: 30161
    # 匿名只读 + 内置口令 = 内网信任域默认；生产环境必须覆盖（文档已注明）。
    adminPassword: "admin"
  nodeExporter:
    image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/prometheus/node-exporter", tag: "v1.9.1" }
  kubeStateMetrics:
    image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/kube-state-metrics/kube-state-metrics", tag: "v2.17.0" }
  alerts:
    # 根文件系统可用低于该百分比、持续 10 分钟 → 告警（0–100）。
    diskLowPercent: 12
    # AEP control-service 5xx 速率阈值（次/秒，10 分钟持续）。
    aep5xxRate: "0.2"
    # 推送通道（企微群机器人 URL）；空 = 仅日志。真实 URL 是凭据：只放
    # values-<env>.local.yaml（gitignored）——不要装完后临时 kubectl patch
    # Secret，下一次 helm upgrade 会重置回此处渲染值。
    webhookUrl: ""
  logging:
    enabled: true
    elasticsearch:
      image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/elasticsearch", tag: "8.18.3" }
      storage: { size: 20Gi, storageClass: longhorn }
      javaOpts: "-Xms1g -Xmx1g"
    kibana:
      image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/kibana", tag: "8.18.3" }
      nodePort: 30160
    fluentBit:
      image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/fluent-bit", tag: "3.2.10" }
      # 只采集列出的命名空间（路径 glob 作用域）。共享集群纪律：不属本平台
      # 的命名空间不列即不采。
      namespaces: [aep-system, digital-employees, memory-system, higress-system, weknora]
  auditShipper:
    enabled: true
    schedule: "*/5 * * * *"
    image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/python", tag: "3.12-slim-bookworm" }
    esURL: http://elasticsearch.logging.svc.cluster.local:9200
    # AEP 管理员口令走一次性 Secret（不入 chart，同 de-platform-creds 纪律）。
    credentialsSecret: audit-shipper-creds
  nodeLogCap:
    # 节点日志硬上限（DaemonSet 形态，免 ssh）：每 loopSeconds 清理超过
    # archiveMaxMiB 的轮转档案，并把超过 liveMaxGiB 的活跃文件截留尾部。
    # journald 的 SystemMaxUse 是主机单元，维持文档化手工步骤
    # （k3s/node-log-cap/README.md）。
    enabled: true
    loopSeconds: 900
    archiveMaxMiB: 200
    liveMaxGiB: 1
    image: { repository: "harbor.zhiyuan.local:30443/zhiyuan/python", tag: "3.12-slim-bookworm" }

# Digital employees. wecom requires the bot's WS session (single instance
# cluster-wide); knowledge is absent until WeKnora is wired per employee.
conversationStore:
  backend: postgres

# P1 节点代理（Firecracker microVM 运行时）。enabled 需先完成两件事：
#   1) kubectl label node <kvm-hosts> zhiyuan.io/kvm=true（当前=burst6、rtl-l20）
#   2) operator env WORKSPACE_MICROVM_NODES 指向同一批节点（分配池，顺序=偏好）
# 特权+root 为 PoC 级隔离决策（无 jailer，2026-10-14）；加固轮再收敛。
# 个人工作区网关默认镜像（operator PERSONAL_WORKSPACE_IMAGE env 覆盖其编译期
# 默认 0.4.2——不带 rooms/email 的老版本；不设置的 CR spec.image 走此值）。
workspaceGateway:
  image: ""
workspaceAgent:
  enabled: false
  # Namespace-local registry credentials, shared by agent and template init containers.
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  # microvm 分配池（operator 的 WORKSPACE_MICROVM_NODES）——顺序=分配偏好：
  # cicd 把 rtl-l20 排前（burst6 根盘 92% 红线，首个工作区避开）。
  microvmNodes: []
  microvmSubnet: 192.168.77.0/24
  image:
    repository: rongxinzy/pw-node-agent
    tag: 0.1.0
  # pw-rootfs 模板镜像（pi-durable-bench 构建，独立版本线 0.5.x）
  templateImage:
    repository: rongxinzy/pw-rootfs
    tag: 0.5.0
  # Additional immutable versions available for per-workspace templateTag.
  # Keep pinned versions here during upgrades; never replace content under a tag.
  additionalTemplates: []
  nodeSelector:
    zhiyuan.io/kvm: "true"
  tolerations:
    - key: rtl.ai/externally-managed
      operator: Exists
      effect: NoSchedule
  workdirRoot: /var/lib/zhiyuan/workspace-agent
  portRange: 8800-8899
  modelBaseURL: http://higress-gateway.higress-system.svc.cluster.local/v1
  # 搭档进程直连的 OpenViking 服务（渲染为 env 盘全局 OPENVIKING_BASE_URL）。
  memoryBaseURL: http://openviking.memory-system.svc.cluster.local:1933
  # /metrics 监听端口（hostNetwork 下的节点端口；勿与 portRange/node-exporter 冲突）。
  metricsPort: 9091
  # Firecracker children share this container cgroup. Any limits must budget
  # for all guests on the node plus agent overhead, not just the Go process.
  resources:
    requests: { cpu: 100m, memory: 128Mi }

employees: []
#  - name: sales-helper
#    displayName: 销售助理
#    wecom: false
#    wecomName: ""

# ---------------------------------------------------------------------------
# 加固（P0）：网络隔离、Pod 安全、资源边界、PostgreSQL 异地备份。
# 全部可按开关回退；滚动步骤见 chart README「加固（P0）」。
# ---------------------------------------------------------------------------

# 数字员工运行时容器默认值（operator 渲染 de-{name} 时使用；CR 的
# spec.resources 优先）。需要 operator 带 RUNTIME_DEFAULT_RESOURCES /
# RUNTIME_SECURITY_CONTEXT 支持的版本，旧 operator 忽略这两个 env。
# 注意：operator 升级后首次 reconcile 会让每个员工按 Recreate 重建一次。
runtimeDefaults:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 4Gi}
  # deerflow-gov 镜像没有声明 USER（2026-10-16 核对 ghcr v16 镜像配置：
  # User 为空 → root），因此默认不强制 runAsNonRoot。镜像改为非 root 后
  # 再加 runAsNonRoot: true / runAsUser。db-init 初始化容器继承除身份字段
  # 外的同一配置。置为 {} 恢复旧行为（不设 securityContext）。
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}

# NetworkPolicy：chart 管理的命名空间默认拒绝入站，再按调用关系放行；
# 数字员工运行时额外限制出站。enabled=false 整体不渲染（回退路径）。
networkPolicy:
  enabled: true
  # AEP /internal 与 /aep/v1 同端口（control-service :8080），L3/L4 策略
  # 无法区分路径。cilium = 渲染 CiliumNetworkPolicy，对运行时 → control-service
  # 只放行 /aep/v1/*（需集群为 Cilium 且启用 L7 代理）；none = 只渲染标准
  # NetworkPolicy，运行时可访问 control-service 全部路径（/internal 仅靠令牌）。
  aepInternalGuard: cilium
  # 运行时允许访问的 control-service 路径（Cilium L7 正则，匹配完整路径）。
  aepAllowedPaths: ["/aep/v1/.*", "/healthz", "/readyz"]
  # Pod/Service 网段：运行时“访问外网”规则从 0.0.0.0/0 中排除，避免绕过
  # 集群内白名单（cicd：podCIDR 10.42.0.0/16、serviceCIDR 10.43.0.0/16）。
  clusterCIDRs: [10.42.0.0/16, 10.43.0.0/16]
  dns:
    namespace: kube-system
    podLabels: {k8s-app: kube-dns}
  # Prometheus 所在命名空间（抓取 /metrics 的入站放行）；默认取
  # observability.monitoringNamespace。
  monitoringNamespace: ""
  higressNamespace: higress-system
  # 需要直连 aep-system/postgres 的其他命名空间：KEDA 的 postgresql 唤醒
  # 触发器（员工休眠/唤醒）从 keda 命名空间轮询 portal 库。
  postgresExtraFromNamespaces: [keda]
  runtime:
    # 运行时访问集群外地址（Web 工具、邮件、外部 MCP 等）。false = 只允许
    # 集群内白名单 + 模型网关。
    allowExternalEgress: true
    # 外网出站端口；空 = 全部端口。
    externalEgressPorts: []
    # 额外允许调用运行时 :8001 的 Pod（主命名空间内的 app 标签）。operator
    # 升级出 component 标签之前，带 A2A 的员工需在此列出其 de-<name>-a2a。
    extraIngressApps: []
    # 额外出站规则（原样拼入运行时出站策略的 egress 列表）。
    extraEgress: []
  # 主命名空间内非本 chart 管理的 Pod（zhiyuanBotUI、pi-companion、个人工作区
  # 等）是否保持入站全开。默认 true 以免默认拒绝误伤；用 Hubble 盘点调用
  # 关系并补齐规则后再置 false。
  openUnmanagedMainNamespacePods: true
  # 观测命名空间（monitoring/logging）的默认拒绝与放行规则。
  observability: true
  # WeKnora 子图命名空间：子图内部调用关系（docreader/redis/postgres）
  # 尚未盘点，默认不渲染。
  weknora: false

# Pod Security Admission 命名空间标签。主命名空间在 workspaceAgent.enabled
# 时自动 enforce=privileged（pw-node-agent 为特权 + hostNetwork + hostPath）。
podSecurity:
  enabled: true
  version: latest
  levels:
    main: {enforce: baseline, warn: restricted, audit: restricted}
    memory: {enforce: baseline, warn: restricted, audit: restricted}
    aep: {enforce: baseline, warn: restricted, audit: restricted}
    # node-exporter / fluent-bit / node-log-cap 需要 hostPath / hostNetwork。
    monitoring: {enforce: privileged, warn: baseline, audit: baseline}
    logging: {enforce: privileged, warn: baseline, audit: baseline}

# 主命名空间资源边界。LimitRange 给未声明资源的容器补默认值（只作用于新
# 建 Pod）；ResourceQuota 需按集群实测容量设定，默认关闭。
resourceBoundaries:
  limitRange:
    enabled: true
    defaultRequest: {cpu: 100m, memory: 128Mi}
    default: {cpu: "2", memory: 4Gi}
    max: {cpu: "8", memory: 16Gi}
  resourceQuota:
    enabled: false
    hard:
      requests.cpu: "16"
      requests.memory: 32Gi
      limits.memory: 96Gi
      persistentvolumeclaims: "60"

